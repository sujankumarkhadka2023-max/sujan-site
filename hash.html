<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hash</title><link rel="stylesheet" href="css/dev.css"></head>
<body><div class="box"><h1>Password hash</h1><label>New password</label><input id="p"><button id="g">Generate</button><label>Paste into js/auth.js</label><textarea id="o" rows="3"></textarea></div>
<script src="js/auth.js"></script><script>g.onclick=async()=>{o.value=await sha(p.value)}</script></body></html>
