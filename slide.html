<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sliding Puzzle | Sujan Kumar Khadka</title>
<link rel="stylesheet" href="games.css">
<style>

#b{display:grid;gap:4px;width:100%;aspect-ratio:1;background:#000;padding:4px;border-radius:10px}
.t{border:0;border-radius:6px;background:#fff;font-weight:700;padding:0;font-size:clamp(18px,8vw,36px)}
.t.ok{background:#cfe9cf}
.t.z{visibility:hidden}

</style>
</head>
<body>
<div class="wrap">
<div id="home"></div>
<div id="game" class="hide">
  <div class="top"><button class="btn" id="back">← Levels</button><div style="text-align:right"><h1 id="ttl"></h1><div class="sub" id="tier"></div></div></div>
  <div class="bar" id="info"></div>
  <div id="stage"></div>
  <div id="ctrl"></div>
</div>
</div>
<div class="modal hide" id="modal"><div class="box" id="mbox"></div></div>
<script src="common.js"></script>
<script>

(function(){
var $=function(s){return document.querySelector(s)};
var n,arr,b,moves,N,init,over;
function size(l){return 3+SKG.tierOf(l)}
function scr(l){var s=size(l),idx=(l-1)%25;return Math.round(s*s*(2+idx/6))}
SKG.init({key:"sk_slide",title:"Sliding Puzzle",sub:function(l){var s=size(l);return s+"×"+s+" grid"},start:start});
function solved(){for(var i=0;i<n*n-1;i++)if(arr[i]!==i+1)return false;return arr[n*n-1]===0}
function start(l){
  n=size(l);N=scr(l);over=false;moves=0;
  var r=SKG.rng(l*101+5),k,i;arr=[];for(i=1;i<n*n;i++)arr.push(i);arr.push(0);
  b=n*n-1;var prev=-1;
  for(k=0;k<N||solved();k++){
    var br=b/n|0,bc=b%n,nb=[];
    if(br>0)nb.push(b-n);if(br<n-1)nb.push(b+n);if(bc>0)nb.push(b-1);if(bc<n-1)nb.push(b+1);
    nb=nb.filter(function(x){return x!==prev});
    var c=nb[(r()*nb.length)|0];arr[b]=arr[c];arr[c]=0;prev=b;b=c}
  init=arr.slice();
  $("#info").innerHTML='<span>⏱ <b id="tm">00:00</b></span><span>Moves: <b id="mv">0</b></span>';
  $("#stage").innerHTML='<div id="b"></div>';
  $("#ctrl").innerHTML='<div class="acts"><button class="btn" id="rs">Restart</button></div>';
  $("#rs").onclick=function(){arr=init.slice();b=arr.indexOf(0);moves=0;over=false;SKG.startT();draw()};
  var bd=$("#b");bd.style.gridTemplateColumns="repeat("+n+",1fr)";
  for(i=0;i<n*n;i++){(function(i){var t=document.createElement("button");t.className="t";t.onclick=function(){tap(i)};bd.appendChild(t)})(i)}
  SKG.startT();draw()}
function tap(i){
  if(over||i===b)return;var br=b/n|0,bc=b%n,r=i/n|0,c=i%n,step;
  if(r===br)step=i>b?1:-1;else if(c===bc)step=i>b?n:-n;else return;
  while(b!==i){arr[b]=arr[b+step];arr[b+step]=0;b+=step}
  moves++;draw();
  if(solved()){over=true;var st=moves<=N*2?3:moves<=N*4?2:1;
    setTimeout(function(){SKG.win(st,"Moves: <b>"+moves+"</b>")},350)}}
function draw(){
  var cs=$("#b").children;
  for(var i=0;i<n*n;i++){var v=arr[i],c=cs[i];c.textContent=v||"";c.className="t"+(v?"":" z")+(v&&v===i+1?" ok":"")}
  $("#mv").textContent=moves}
})();

</script>
</body>
</html>
