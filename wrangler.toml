name = "content-platform-api"
main = "backend/worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "content_platform"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
COOKIE_NAME = "developer_session"
SESSION_TTL_SECONDS = "28800"
MAX_IMAGE_BYTES = "10485760"
GITHUB_OWNER = "REPLACE_WITH_GITHUB_OWNER"
GITHUB_REPO = "REPLACE_WITH_GITHUB_REPOSITORY"
GITHUB_MEDIA_PATH = "frontend-public/assets/uploads"
GITHUB_BRANCH = "main"
FRONTEND_ORIGIN = "REPLACE_WITH_YOUR_DEVELOPER_FRONTEND_ORIGIN"
