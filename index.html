<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUJAN KUMAR KHADKA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4ED;--ink:#171717;--mute:#5F5F5F;--line:#D6D1C7;--acc:#8B1E2D;--card:#fff;--fm:#B8B4AC}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;line-height:1.65}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2}
.meta,.cat,nav a,button,.btn,input,select,textarea,.more{font-family:Inter,Arial,sans-serif}
.vh{position:absolute;left:-9999px}
#hdr img{width:100%;display:block}
#hdr nav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 8px;background:var(--bg)}
nav a{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;padding:4px 0;border-bottom:2px solid transparent;transition:.2s}
nav a:hover,nav a.active{color:var(--acc);border-color:var(--acc)}
.page{max-width:1180px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:60vh}
section.blk{padding:34px 28px;border-top:1px solid var(--line)}section.blk:first-child{border-top:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}.sh h2{font-size:1.6rem}
.more{color:var(--acc);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;background:none;border:0;cursor:pointer;transition:.2s}.more:hover{letter-spacing:.16em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;transition:.25s}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px)}
.ph{aspect-ratio:3/2;background:#e9e5db;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img,.feat:hover .ph img{transform:scale(1.04)}
.cb{padding:14px 16px 18px}.cb h3{font-size:1.08rem;margin:6px 0;transition:color .2s}.card:hover h3,.feat:hover h1{color:var(--acc)}
.cb p{font-size:.92rem;color:var(--mute)}
.cat{color:var(--acc);font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.meta{color:var(--mute);font-size:.75rem;margin-top:8px}
.feat{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center}.feat .ph{aspect-ratio:16/10}
.feat h1{font-size:clamp(1.7rem,3.4vw,2.6rem);margin:8px 0;transition:color .2s}.feat p{color:var(--mute);font-size:1.05rem}
.mr{list-style:none;counter-reset:n}.mr li{counter-increment:n;padding:12px 0;border-top:1px solid var(--line);display:flex;gap:16px}
.mr li:first-child{border:0}.mr li:before{content:counter(n);font:700 1.6rem 'Playfair Display';color:var(--acc)}.mr a:hover{color:var(--acc)}
.pt{padding:38px 28px 10px}.pt h1{font-size:clamp(2rem,5vw,3rem)}
.empty{color:var(--mute);font-family:Inter,sans-serif;font-size:.9rem}
.art{max-width:780px;margin:0 auto;padding:38px 24px}.art h1{font-size:clamp(1.9rem,4.5vw,3rem);margin:8px 0}
.art .sub{font-size:1.2rem;color:var(--mute);margin-bottom:14px}
.hero{margin:22px -24px;aspect-ratio:16/9;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}
.body p{margin-bottom:1.2em;font-size:1.1rem}
.share{position:relative;display:inline-block;margin-top:10px}
.share summary{list-style:none;cursor:pointer;font:600 .75rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--acc)}
.share summary::-webkit-details-marker{display:none}
.share div{position:absolute;z-index:5;background:#fff;border:1px solid var(--line);padding:8px 14px;display:flex;flex-direction:column;gap:6px;min-width:140px;margin-top:6px}
.share a,.share button{font:.8rem Inter,sans-serif;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink)}.share a:hover,.share button:hover{color:var(--acc)}
.tl{border-left:2px solid var(--line);margin-left:8px}.tl article{padding:0 0 22px 22px;position:relative}
.tl article:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--acc)}.tl a:hover{color:var(--acc)}
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding:30px 28px}
.cf{display:flex;flex-direction:column;gap:12px}
input,select,textarea{padding:11px 12px;border:1px solid var(--line);background:#fff;font-size:.95rem;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn,button.b{background:var(--ink);color:var(--bg);border:0;padding:11px 20px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;cursor:pointer;transition:.2s;align-self:flex-start;margin:10px 8px 0 0}
.btn:hover,button.b:hover{background:var(--acc)}button.s{background:#fff!important;color:var(--ink)!important;border:1px solid var(--ink)!important}
.info p{margin-bottom:10px}.info a:hover{color:var(--acc)}
.ft{background:#171717;color:#F7F4ED;border-top:3px solid var(--acc)}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;padding:46px 20px;max-width:1180px;margin:0 auto}
.ft h4{font:600 .8rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.14em;margin-bottom:14px}
.ft p,.ft li{color:var(--fm);font-size:.9rem}.ft ul{list-style:none}.ft li{margin-bottom:8px}
.ft a:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--acc)}
.fb{font:900 1.4rem 'Playfair Display';color:#F7F4ED;margin-bottom:6px}
.ft form{display:flex;flex-direction:column;gap:10px;margin-top:12px}.ft input{background:transparent;border-color:#444;color:#F7F4ED}
.ft .btn{background:var(--acc);color:#fff;margin:0}.ft .btn:hover{background:#a82437}
.soc{display:flex;gap:10px;flex-wrap:wrap}
.soc a{width:28px;height:28px;border:1px solid #555;border-radius:50%;display:grid;place-items:center;font:600 .62rem Inter,sans-serif;color:#F7F4ED;text-transform:uppercase}
.soc a:hover{background:var(--acc);border-color:var(--acc);text-decoration:none}
.fbot{border-top:1px solid #333;max-width:1180px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:.78rem Inter,sans-serif;color:var(--fm)}
.fbot nav{display:flex;gap:18px;flex-wrap:wrap}.fbot a:hover{color:#fff}
/* developer */
.dv{max-width:900px;margin:0 auto;padding:16px;font-family:Inter,Arial,sans-serif}
.dv h1,.dv h2{margin-bottom:12px}.dv label{display:block;font-size:.8rem;margin:10px 0 4px;color:var(--mute)}
.box{max-width:420px;margin:10vh auto;background:#fff;border:1px solid var(--line);padding:28px}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:12px 0 16px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font:inherit}.tabs button.on{border-bottom:3px solid var(--acc)}
.row{display:flex;gap:10px}.row>*{flex:1}
.item{background:#fff;border:1px solid var(--line);padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.err{color:var(--acc);font-size:.85rem;margin-top:10px}
@media(max-width:960px){.grid,.fg{grid-template-columns:repeat(2,1fr)}.feat,.contact{grid-template-columns:1fr}}
@media(max-width:560px){.grid,.fg{grid-template-columns:1fr}section.blk,.pt,.contact{padding-left:16px;padding-right:16px}.fg{gap:26px;padding:34px 16px}.page{border-left:0;border-right:0}.row{flex-direction:column}}
</style>
</head>

/* ===== CORE ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let C=DEFAULT;
const LBL={article:'Article',history:'History',travel:'Travel'};
const fd=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
const meta=s=>`<div class="meta">${[fd(s.date),s.author&&'By '+esc(s.author),s.readTime&&esc(s.readTime)+' min read'].filter(Boolean).join(' · ')}</div>`;
const href=s=>'#/story/'+encodeURIComponent(s.id);
const card=s=>`<a class="card" href="${href(s)}"><div class="ph">${s.image?`<img loading="lazy" src="${esc(s.image)}" alt="${esc(s.title)}">`:''}</div><div class="cb"><span class="cat">${esc(s.tag||LBL[s.category]||'')}</span><h3>${esc(s.title)}</h3><p>${esc(s.subtitle||'')}</p>${meta(s)}</div></a>`;
const sorted=()=>(C.stories||[]).slice().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
let LISTS=[];
function block(title,list,more){
  if(!list.length)return `<section class="blk"><div class="sh"><h2>${esc(title)}</h2></div><p class="empty">No stories yet.</p></section>`;
  const i=LISTS.push(list)-1;
  const link=more?`<a class="more" href="${more}">See More →</a>`:(list.length>4?'<button class="more" data-more>See More →</button>':'');
  return `<section class="blk" data-b="${i}"><div class="sh"><h2>${esc(title)}</h2>${link}</div><div class="grid"></div></section>`;
}
function initBlocks(){document.querySelectorAll('[data-b]').forEach(b=>{const L=LISTS[b.dataset.b],g=b.querySelector('.grid'),btn=b.querySelector('[data-more]');let n=4;
 const d=()=>{g.innerHTML=L.slice(0,n).map(card).join('');if(btn)btn.style.display=n>=L.length?'none':''};d();if(btn)btn.onclick=()=>{n+=4;d()}})}
function chrome(show){
  const name=C.site.name||'SUJAN KUMAR KHADKA',r=location.hash.slice(1)||'/';
  if(!show){$('#hdr').innerHTML='';$('#ftr').innerHTML='';return}
  const nav=[['#/','Home','/'],['#/article','Article','/article'],['#/history','History','/history'],['#/travel','Travel','/travel'],['#/contact','Contact','/contact']];
  $('#hdr').innerHTML=`<a href="#/"><h1 class="vh">${esc(name)}</h1><img src="${HEADER_IMG}" alt="${esc(name)}"></a><nav>${nav.map(n=>`<a href="${n[0]}" class="${n[2]===r||(n[2]==='/article'&&r.startsWith('/story'))?'active':''}">${n[1]}</a>`).join('')}</nav>`;
  const F=C.footer,ab={facebook:'f',x:'X',instagram:'ig',linkedin:'in',youtube:'yt',tiktok:'tt',other:'↗'},sl=F.socialLinks||{};
  const soc=Object.keys(ab).filter(k=>sl[k]).map(k=>`<a href="${esc(sl[k])}" target="_blank" rel="noopener" aria-label="${k}">${ab[k]}</a>`).join('');
  const lg=(F.legalLinks||[]).filter(l=>l.name).map(l=>l.url?`<a href="${esc(l.url)}">${esc(l.name)}</a>`:`<span>${esc(l.name)}</span>`).join('');
  $('#ftr').innerHTML=`<footer class="ft"><div class="fg"><div>${F.logo?`<img src="${esc(F.logo)}" alt="" style="height:40px;margin-bottom:10px">`:''}<div class="fb">${esc(F.newspaperName||name)}</div>${F.tagline?`<p><em>${esc(F.tagline)}</em></p>`:''}<p style="margin-top:10px">${esc(F.description||'')}</p></div>
<div><h4>${esc(F.quickLinksTitle||'')}</h4><ul>${(F.quickLinks||[]).map(l=>`<li><a href="${esc(l.url)}">${esc(l.name)}</a></li>`).join('')}</ul></div>
<div><h4>${esc(F.newsletterTitle||'')}</h4><p>${esc(F.newsletterDescription||'')}</p><form id="nf" method="POST" action="${esc(F.newsletterAction||'')}"><input type="email" name="email" required placeholder="${esc(F.emailPlaceholder||'')}"><button class="btn">${esc(F.subscribeButton||'Subscribe')}</button></form></div>
<div><h4>${esc(F.followTitle||'')}</h4><div class="soc">${soc}</div></div></div><div class="fbot"><span>${esc(F.copyright||'')}</span><nav>${lg}</nav></div></footer>`;
  $('#nf').onsubmit=e=>{if(!F.newsletterAction)e.preventDefault()};
}
/* ===== PUBLIC PAGES ===== */
function pubPage(r){
  const S=sorted(),M=$('#main'),site=C.site;LISTS=[];let h='';
  const p=r.split('/').filter(Boolean),k=p[0]||'home';
  if(k==='home'){
    const f=S.find(s=>s.featured)||S[0];
    if(!S.length)h='<section class="blk"><p class="empty">No stories published yet.</p></section>';
    else{
      h+=`<section class="blk"><a class="feat" href="${href(f)}"><div class="ph">${f.image?`<img src="${esc(f.image)}" alt="">`:''}</div><div><span class="cat">Featured · ${esc(LBL[f.category]||'')}</span><h1>${esc(f.title)}</h1><p>${esc(f.subtitle||'')}</p>${meta(f)}</div></a></section>`;
      h+=block('Latest Stories',S.filter(s=>s!==f),'');
      ['article','history','travel'].forEach(c=>h+=block('Latest '+LBL[c],S.filter(s=>s.category===c),'#/'+c));
      const mr=S.filter(s=>s.mostRead).slice(0,5);
      if(mr.length)h+=`<section class="blk"><div class="sh"><h2>Most Read</h2></div><ol class="mr">${mr.map(s=>`<li><div><a href="${href(s)}"><h3>${esc(s.title)}</h3></a>${meta(s)}</div></li>`).join('')}</ol></section>`;
    }
  }else if(k==='story'){
    const s=S.find(x=>String(x.id)===decodeURIComponent(p[1]||''));
    if(!s)h='<div class="pt"><h1>Story not found</h1></div>';
    else{
      document.title=s.title+' | '+site.name;
      const url=location.href,t=encodeURIComponent(s.title),u=encodeURIComponent(url),rel=S.filter(x=>x.category===s.category&&x!==s).slice(0,3);
      h=`<article class="art"><span class="cat">${esc(LBL[s.category]||'')}${s.tag?' · '+esc(s.tag):''}</span><h1>${esc(s.title)}</h1><p class="sub">${esc(s.subtitle||'')}</p>${meta(s)}
<details class="share"><summary>Share</summary><div><button id="cp">Copy Link</button><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=${u}&text=${t}">X / Twitter</a><a target="_blank" rel="noopener" href="https://wa.me/?text=${t}%20${u}">WhatsApp</a><a target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${u}">LinkedIn</a><a href="mailto:?subject=${t}&body=${u}">Email</a></div></details>
${s.image?`<div class="hero"><img src="${esc(s.image)}" alt="${esc(s.title)}"></div>`:''}
<div class="body">${String(s.body||'').split(/\n\s*\n/).map(x=>`<p>${esc(x).replace(/\n/g,'<br>')}</p>`).join('')}</div></article>
${rel.length?`<section class="blk"><div class="sh"><h2>Related Articles</h2></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${rel.map(card).join('')}</div></section>`:''}`;
    }
  }else if(k==='article'){
    h='<div class="pt"><h1>Article</h1></div>'+block('All Articles',S.filter(x=>x.category==='article'),'');
  }else if(k==='history'||k==='travel'){
    const L=S.filter(s=>s.category===k),used=new Set();
    const SEC=k==='history'?[['Featured History Articles','Featured'],['Historical Stories','Story'],['Historical Periods','Period']]:[['Featured Destinations','Destination'],['Travel Stories','Story'],['Travel Guides','Guide'],['Travel Tips','Tip']];
    h=`<div class="pt"><h1>${LBL[k]}</h1></div>`;
    if(k==='history'){const ev=L.filter(s=>s.tag==='Event').sort((a,b)=>new Date(a.date)-new Date(b.date));ev.forEach(s=>used.add(s));
      if(ev.length)h+=`<section class="blk"><div class="sh"><h2>Timeline of Important Events</h2></div><div class="tl">${ev.map(s=>`<article><span class="cat">${new Date(s.date).getFullYear()}</span><h3><a href="${href(s)}">${esc(s.title)}</a></h3><p class="meta">${esc(s.subtitle||'')}</p></article>`).join('')}</div></section>`}
    SEC.forEach(([t,tg])=>{const x=L.filter(s=>tg==='Featured'?s.featured:s.tag===tg);x.forEach(s=>used.add(s));if(x.length)h+=block(t,x,'')});
    const o=L.filter(s=>!used.has(s));if(o.length)h+=block('More Stories',o,'');
    if(!L.length)h+='<section class="blk"><p class="empty">No stories yet.</p></section>';
  }else if(k==='contact'){
    const sc=site.social||{},ln=Object.keys(sc).filter(x=>sc[x]).map(x=>`<a href="${esc(sc[x])}" target="_blank" rel="noopener">${x}</a>`).join(' · ');
    h=`<div class="pt"><h1>Contact</h1></div><div class="contact"><form class="cf" id="cf" method="POST" action="${esc(site.contactFormAction||'')}"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Your email" required><input name="subject" placeholder="Subject"><textarea name="message" rows="6" placeholder="Your message" required></textarea><button class="btn">Send Message</button><p class="meta" id="cm"></p></form><div class="info"><h2>${esc(site.name)}</h2>${site.email?`<p>Email: <a href="mailto:${esc(site.email)}">${esc(site.email)}</a></p>`:''}${site.phone?`<p>Phone: ${esc(site.phone)}</p>`:''}${site.address?`<p>${esc(site.address)}</p>`:''}${ln?`<p>${ln}</p>`:''}${site.mapEmbedUrl?`<iframe src="${esc(site.mapEmbedUrl)}" style="border:0;width:100%;height:240px" loading="lazy"></iframe>`:''}</div></div>`;
  }else h='<div class="pt"><h1>Page not found</h1></div>';
  M.innerHTML=h;initBlocks();
  const cp=$('#cp');if(cp)cp.onclick=()=>navigator.clipboard.writeText(location.href).then(()=>cp.textContent='Copied ✓');
  const cf=$('#cf');if(cf)cf.onsubmit=e=>{if(!site.contactFormAction){e.preventDefault();$('#cm').textContent='Contact form is not connected yet.'}};
}
/* ===== DEVELOPER (hidden) ===== */
const KD='skk_draft',KG='skk_gh';
function devLogin(){
  $('#main').innerHTML=`<div class="dv"><div class="box"><h1>Developer Login</h1><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button class="b" id="go">Log in</button><p class="err" id="e"></p></div></div>`;
  const go=async()=>{if($('#u').value.trim()===DEV_USER&&await sha($('#p').value)===PASSWORD_HASH){sessionStorage.setItem('skk_dev','1');devDash()}else $('#e').textContent='Wrong username or password.'};
  $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};
}
function devDash(){
  let D=JSON.parse(localStorage.getItem(KD)||'null')||JSON.parse(JSON.stringify(C));D.stories=D.stories||[];
  const gh=JSON.parse(localStorage.getItem(KG)||'{}');let img='',eid=null;
  const save=()=>localStorage.setItem(KD,JSON.stringify(D));
  $('#main').innerHTML=`<div class="dv"><div style="display:flex;justify-content:space-between;align-items:center"><h1>Developer Dashboard</h1><button class="b s" id="out">Log out</button></div>
<div class="tabs"><button class="on" data-t="st">Stories</button><button data-t="se">Site &amp; Footer</button><button data-t="pu">Publish</button></div>
<div id="st"><div id="list"></div><h2 id="ft">New story</h2>
<div class="row"><div><label>Section</label><select id="category"><option value="article">Article</option><option value="history">History</option><option value="travel">Travel</option></select></div><div><label>Type (optional)</label><input id="tag" placeholder="History: Event/Period/Story · Travel: Destination/Guide/Story/Tip"></div></div>
<label>Headline</label><input id="title"><label>Subtitle</label><input id="subtitle">
<div class="row"><div><label>Author</label><input id="author"></div><div><label>Date</label><input id="date" type="date"></div><div><label>Read time (min)</label><input id="readTime" type="number"></div></div>
<label>Image (phone or computer)</label><input id="img" type="file" accept="image/*"><img id="pv" alt="" style="max-height:140px;margin-top:8px">
<label>Full story (blank line = new paragraph)</label><textarea id="body" rows="10"></textarea>
<label><input type="checkbox" id="featured" style="width:auto"> Featured story</label><label><input type="checkbox" id="mostRead" style="width:auto"> Show in Most Read</label>
<button class="b" id="save">Save story</button><button class="b s" id="clr">Clear</button></div>
<div id="se" hidden><p class="meta">Change text only. Keep quotes and commas.</p><label>Site settings</label><textarea id="siteJ" rows="14"></textarea><label>Footer settings</label><textarea id="footJ" rows="20"></textarea><button class="b" id="saveS">Save settings</button><p class="err" id="se_e"></p></div>
<div id="pu" hidden><p>Saving here only stores a draft on this phone. <b>Publish</b> sends it to GitHub so everyone sees it.</p>
<label>GitHub repo (owner/name)</label><input id="repo" value="${esc(gh.repo||'')}" placeholder="yourname/yourrepo">
<label>Branch</label><input id="br" value="${esc(gh.branch||'main')}">
<label>GitHub token (fine-grained, Contents: read &amp; write, this repo only)</label><input id="tok" type="password" value="${esc(gh.token||'')}">
<button class="b" id="pub">Publish to GitHub</button><button class="b s" id="dl">Download content.json</button><button class="b s" id="rst">Discard draft</button><p class="err" id="pe"></p>
<hr style="margin:20px 0;border-color:#D6D1C7"><label>Password hash tool: type a new password, copy the result into PASSWORD_HASH in index.html</label><input id="np" placeholder="new password"><button class="b s" id="hg">Generate</button><textarea id="ho" rows="2"></textarea></div></div>`;
  const $$=id=>document.getElementById(id);
  const render=()=>{$$('list').innerHTML=D.stories.length?D.stories.map(s=>`<div class="item"><span><b>${esc(s.title)}</b><br><small>${s.category} · ${s.date||''}</small></span><span><button class="b s" data-e="${esc(s.id)}">Edit</button><button class="b" data-d="${esc(s.id)}">Delete</button></span></div>`).join(''):'<p class="empty">No stories yet.</p>';
    $$('siteJ').value=JSON.stringify(D.site,null,2);$$('footJ').value=JSON.stringify(D.footer,null,2);
    document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>ed(b.dataset.e));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete this story?')){D.stories=D.stories.filter(x=>x.id!==b.dataset.d);save();render()}})};
  const F=['category','tag','title','subtitle','author','date','readTime','body'];
  const clr=()=>{eid=null;img='';F.forEach(f=>$$(f).value='');$$('category').value='article';$$('featured').checked=$$('mostRead').checked=false;$$('pv').removeAttribute('src');$$('img').value='';$$('ft').textContent='New story'};
  const ed=id=>{const s=D.stories.find(x=>x.id===id);eid=id;F.forEach(f=>$$(f).value=s[f]||'');$$('featured').checked=!!s.featured;$$('mostRead').checked=!!s.mostRead;img=s.image||'';if(img)$$('pv').src=img;$$('ft').textContent='Edit story';$$('ft').scrollIntoView()};
  $$('out').onclick=()=>{sessionStorage.removeItem('skk_dev');location.hash='#/'};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['st','se','pu'].forEach(i=>$$(i).hidden=i!==b.dataset.t)});
  $$('clr').onclick=clr;
  $$('img').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1200/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.75);$$('pv').src=img};i.src=r.result};r.readAsDataURL(f)};
  $$('save').onclick=()=>{if(!$$('title').value.trim())return alert('Headline is required');
    const s={id:eid||Date.now().toString(36),image:img,featured:$$('featured').checked,mostRead:$$('mostRead').checked};F.forEach(f=>s[f]=$$(f).value.trim());if(!s.date)s.date=new Date().toISOString().slice(0,10);
    D.stories=eid?D.stories.map(x=>x.id===eid?s:x):[s,...D.stories];save();clr();render();alert('Saved as draft. Open the Publish tab to put it online.')};
  $$('saveS').onclick=()=>{try{D.site=JSON.parse($$('siteJ').value);D.footer=JSON.parse($$('footJ').value);save();$$('se_e').textContent='Saved ✓'}catch(e){$$('se_e').textContent='Invalid format: '+e.message}};
  $$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='content.json';a.click()};
  $$('rst').onclick=()=>{if(confirm('Discard draft and reload published content?')){localStorage.removeItem(KD);devDash()}};
  $$('hg').onclick=async()=>{$$('ho').value=await sha($$('np').value)};
  $$('pub').onclick=async()=>{
    const g={repo:$$('repo').value.trim(),branch:$$('br').value.trim()||'main',token:$$('tok').value.trim()};localStorage.setItem(KG,JSON.stringify(g));
    const pe=$$('pe');pe.textContent='Publishing…';
    try{const api=`https://api.github.com/repos/${g.repo}/contents/data/content.json`,H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
      for(const s of D.stories){if(s.image&&s.image.startsWith('data:')){pe.textContent='Uploading image…';const path='images/'+s.id+'-'+Date.now().toString(36)+'.jpg';
        const ri=await fetch(`https://api.github.com/repos/${g.repo}/contents/${path}`,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Add image',branch:g.branch,content:s.image.split(',')[1]})});
        if(!ri.ok)throw new Error((await ri.json()).message||ri.status);s.image=path;save()}}
      pe.textContent='Publishing…';
      let sha_;const r0=await fetch(api+'?ref='+encodeURIComponent(g.branch),{headers:H});if(r0.ok)sha_=(await r0.json()).sha;
      const body={message:'Update content',branch:g.branch,content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2))))};if(sha_)body.sha=sha_;
      const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error((await r.json()).message||r.status);pe.style.color='#1a6b2e';pe.textContent='Published ✓ The site updates in about a minute.'}
    catch(e){pe.style.color='';pe.textContent='Failed: '+e.message}};
  render();
}
/* ===== ROUTER ===== */
async function route(){
  const r=location.hash.slice(1)||'/';scrollTo(0,0);document.title=(C.site.name||'SUJAN KUMAR KHADKA');
  if(r==='/developer'){chrome(false);document.title='Developer';sessionStorage.getItem('skk_dev')?devDash():devLogin();return}
  chrome(true);pubPage(r);
}
(async()=>{try{const x=await fetch('data/content.json?'+Date.now(),{cache:'no-store'});if(x.ok){const j=await x.json();if(j&&j.site)C=j}}catch(e){}
 route();addEventListener('hashchange',route)})();
</script>
