<style>

/* ---------- motion graphics ---------- */
#pg{position:fixed;top:0;left:0;height:3px;width:100%;z-index:99;background:linear-gradient(90deg,#ffe500,var(--ac),#3b82f6);transform:scaleX(0);transform-origin:0 50%;pointer-events:none}

.hd:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shn 7s ease-in-out 1.5s infinite;pointer-events:none}

.sec>h2{position:relative;display:inline-block}.sec>h2:after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:0 50%;transition:transform .8s .2s cubic-bezier(.2,.7,.2,1)}
.sec.in>h2:after{transform:scaleX(1)}
.card{transition:transform .35s ease,box-shadow .35s ease}.card:hover,.card.rv.in:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(0,0,0,.14)}
.card.rv{transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .35s;transition-delay:var(--d,0s)}
.card.rv.in{transition:transform .35s ease,box-shadow .35s ease,opacity .3s;transition-delay:0s}
.card a:has(.ph){display:block;overflow:hidden}.card .ph{transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .5s}.card:hover .ph{transform:scale(1.07);filter:saturate(1.15)}
.card h3 a{background:linear-gradient(var(--ac),var(--ac)) 0 100%/0 2px no-repeat;transition:background-size .4s}.card:hover h3 a{background-size:100% 2px}
nav a{position:relative}nav a:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--ac);transform:scaleX(0);transition:transform .3s}nav a:hover:after,nav a.on:after{transform:scaleX(1)}
footer a{transition:transform .25s,color .2s}footer a:hover{transform:translateX(6px)}
.ins{animation:glow 3.2s ease-in-out infinite}@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,229,0,0)}50%{box-shadow:0 0 18px 2px rgba(255,229,0,.28)}}
.ins .bt{transition:transform .2s}.ins .bt:hover{transform:scale(1.06)}

/* ---------- v3: transitions, sticky nav, theme, intro, extras ---------- */

.thb{font-size:12px;color:var(--mu);background:none;border:1px solid var(--ln);border-radius:20px;padding:2px 10px;margin-left:10px;cursor:pointer}.thb:hover{color:var(--ac);border-color:var(--ac)}
.nb{position:sticky;top:0;z-index:50;transition:background-color .35s,box-shadow .35s,padding .35s,border-color .35s}

.nb.sc{background:rgba(5,47,107,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.3);border-bottom-color:#ffe500;padding-top:env(safe-area-inset-top,0px)}
.nb.sc nav a{padding-top:10px;padding-bottom:9px;font-size:clamp(15px,2vw,19px)}.nb.sc #mb{width:38px;height:38px;margin:4px 0;gap:4px}.nb.sc #mb i{width:20px}
main.mi{animation:mi .5s cubic-bezier(.2,.7,.2,1) both}@keyframes mi{from{opacity:0;transform:translate(var(--dx,0px),12px)}to{opacity:1;transform:none}}

.ar{display:inline-block;transition:transform .3s ease}.card:hover .ar,.sm:hover .ar{transform:translateX(8px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:34px 0 0;border-top:2px solid var(--tx);padding-top:18px;text-align:center;font-family:system-ui,sans-serif}
.st b{display:block;font:700 clamp(30px,7vw,54px)/1.1 Georgia,'Times New Roman',serif;color:var(--ac);font-variant-numeric:tabular-nums}.st span{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
#btt{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:46px;height:46px;border-radius:50%;border:0;background:#ffe500;color:#052f6b;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translateY(14px) scale(.8);transition:opacity .35s,transform .35s,visibility .35s}

#intro svg{width:104px;height:104px}#intro circle{fill:none;stroke:#ffe500;stroke-width:4;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transform:rotate(-90deg);transform-origin:50% 50%;animation:dr 1s ease .1s forwards}

@media(prefers-reduced-motion:reduce){#intro{display:none}main.mi,.wd{animation:none!important;opacity:1;transform:none}main.mo{transition:none}html.tx,html.tx *{transition:none!important}#btt{transition:none}}

</style></head><body>
<div id="intro" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><text x="50" y="62" text-anchor="middle" font-size="34" font-weight="700" font-family="Georgia,serif">SK</text></svg><b>The Sujan Khadka</b></div>
<div id="app"></div>
<script>
const MULTI=['History','Culture & Lifestyle'];const CATS=['World','Opinion','History','Culture & Lifestyle'],SL={World:'world',Opinion:'opinion',History:'history','Culture & Lifestyle':'culture'};
const SUBS={'World':['News','Analysis','Explainer'],'Culture & Lifestyle':['Culture','Lifestyle']};
const PG={about:'About',contact:'Contact',support:'Support us',privacy:'Privacy',cookies:'Cookies',terms:'Terms'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={articles:[],home:[],pages:{},views:{}},ready=false,A=null,adm=null,ed=null,tab='articles',limit={};
const fd=d=>new Date(d).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const rt=b=>Math.max(1,Math.round((b||'').split(/\s+/).length/220));
const live=()=>D.articles.filter(a=>a.status==='published'&&new Date(a.date)<=new Date()).sort((a,b)=>new Date(b.date)-new Date(a.date));
const url=a=>'/'+SL[a.category]+'/'+a.slug,safeImg=s=>s&&s.startsWith('/img/')?esc(s):'';
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'story';
const api=(p,o={})=>fetch(p,o);

/* ---------- public ---------- */
function card(a){const im=safeImg(a.thumb||a.image);return `<div class="card">${im?`<a href="${url(a)}"><img class="ph" loading="lazy" src="${im}" alt="${esc(a.imageCaption||a.title)}"></a>`:''}<div class="cat">${esc(a.subcategory||a.category)}</div><h3><a href="${url(a)}">${esc(a.title)}</a></h3>${a.subtitle?`<p>${esc(a.subtitle)}</p>`:''}<div class="meta">${esc(a.author)} · ${fd(a.date)}</div><a class="sm" href="${url(a)}">Read more <span class="ar">→</span></a></div>`}
function block(t,list,key){if(!list.length)return `<div class="sec"><h2>${t}</h2><div class="empty">No stories published yet.</div></div>`;const n=limit[key+t]||4;
 return `<div class="sec"><h2><a href="/${key}">${t}</a></h2><div class="g">${list.slice(0,n).map(card).join('')}</div>${list.length>n?`<button class="more" onclick="limit['${key+t}']=${n}+4;go()">See more</button>`:''}</div>`}
function shell(inner,cur){
 const items=[['Home','/'],...CATS.map(c=>[c,'/'+SL[c]]),['Games','/games.html']];
 return `<div class="util" id="top"><div class="w"><span>${new Date().toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span><span><a href="/p/support">Support</a><button class="thb" id="thm" aria-label="Toggle dark mode" onclick="toggleTheme()"></button></span></div></div>
 <a class="hd" href="/" aria-label="The Sujan Khadka — home"><img src="/header.webp" width="1600" height="262" fetchpriority="high" alt="The Sujan Khadka"></a>
 <div class="nb"><div class="w"><nav aria-label="Sections">${items.map(([t,h])=>`<a href="${h}" class="${cur===h?'on':''}">${t}</a>`).join('')}</nav><button id="mb" aria-label="Menu" aria-expanded="false" aria-controls="mp" onclick="const m=$('#mp');m.classList.toggle('open');this.setAttribute('aria-expanded',m.classList.contains('open'))"><i></i><i></i><i></i></button>
 <div id="mp"><h4>Sections</h4>${items.map(([t,h])=>`<a href="${h}">${t}</a>`).join('')}<h4>About</h4><a href="/p/about">About</a><a href="/p/contact">Contact</a><h4>Support</h4><a href="/p/support">Support us</a></div></div></div>
 <div class="w"><main id="main">${inner}</main></div>
 <footer><div class="w"><div class="g"><div><h4>Sections</h4>${CATS.map(c=>`<a href="/${SL[c]}">${c}</a>`).join('')}</div><div><h4>About</h4><a href="/p/about">About</a><a href="/p/contact">Contact</a><a href="/p/support">Support us</a></div></div><div class="ins" id="ins"><div><h4>Install as an app</h4><span>Add the site to your home screen. Recent stories open even with weak internet.</span><span id="inh" style="display:none"></span></div><button class="bt" id="inb" onclick="installApp()">Install</button></div><div class="meta fb"><span>© ${new Date().getFullYear()} The Sujan Khadka. All rights reserved.</span><a href="#top" onclick="event.preventDefault();document.getElementById('top').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})">Back to top ↑</a></div></div></footer>`}
function home(){const L=live();if(!L.length)return `<div class="empty" style="padding:60px 0;text-align:center">No stories have been published yet.</div>`;
 let f=D.home.map(id=>L.find(a=>a.id===id)).filter(Boolean);if(!f.length)f=L.slice(0,5);
 const [lead,...rest]=f,sec=rest.slice(0,4),im=safeImg(lead.image);
 let h=`<section class="lead"><div><div class="cat">${esc(lead.category)}</div><h1><a href="${url(lead)}">${esc(lead.title)}</a></h1><p>${esc(lead.subtitle)}</p><div class="meta">${esc(lead.author)} · ${fd(lead.date)}</div><a class="sm" href="${url(lead)}">Read more <span class="ar">→</span></a></div>${im?`<a href="${url(lead)}"><img class="ph" fetchpriority="high" decoding="async" src="${im}" alt="${esc(lead.imageCaption||lead.title)}"></a>`:''}</section>`;
 if(sec.length)h+=`<div class="sec"><div class="g">${sec.map(card).join('')}</div></div>`;
 h+=stats(L);
 CATS.forEach(c=>h+=block(c,L.filter(a=>a.category===c),SL[c]));return h}
function stats(L){let v=0;for(const k in (D.views||{}))v+=+D.views[k]||0;let g=0;try{g=+localStorage.getItem('sk_games_played')||0}catch(e){}
 const c=(n,l)=>`<div class="st"><b data-n="${n}">${n.toLocaleString()}</b><span>${l}</span></div>`;
 return `<div class="stats">${c(L.length,'Stories published')}${c(v,'Total reads')}${c(g,'Games played')}</div>`}
function section(c){const L=live().filter(a=>a.category===c),k=SL[c];let h=`<h1 style="margin:24px 0 0">${c}</h1>`;

/* theme toggle */
function effTheme(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function thUi(){const b=$('#thm');if(b)b.textContent=effTheme()==='dark'?'☀ Light':'☾ Dark'}
function toggleTheme(){const h=document.documentElement,n=effTheme()==='dark'?'light':'dark';h.classList.add('tx');h.setAttribute('data-theme',n);try{localStorage.setItem('sk_theme',n)}catch(e){}thUi();setTimeout(()=>h.classList.remove('tx'),700)}
/* progress bar, sticky nav, back-to-top, header parallax */
(function(){const pg=document.createElement('div');pg.id='pg';const bt=document.createElement('button');bt.id='btt';bt.setAttribute('aria-label','Back to top');
 bt.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
 bt.onclick=()=>scrollTo({top:0,behavior:RM?'auto':'smooth'});document.body.append(pg,bt);
 let t=0;const upd=()=>{t=0;const y=scrollY,ar=document.querySelector('article');let p;
  if(ar){const r=ar.getBoundingClientRect(),tot=r.height-innerHeight*.55;p=tot>0?-r.top/tot:0}else{const h=document.documentElement.scrollHeight-innerHeight;p=h>0?y/h:0}
  pg.style.transform='scaleX('+Math.max(0,Math.min(1,p))+')';
  const nb=document.querySelector('.nb');if(nb)nb.classList.toggle('sc',y>90);bt.classList.toggle('show',y>500);
  if(!RM){const i=document.querySelector('.hd img');if(i&&y<400)i.style.objectPosition='right calc(50% + '+y*.08+'px)'}};
 window.__upd=upd;addEventListener('scroll',()=>{if(!t)t=requestAnimationFrame(upd)},{passive:true});addEventListener('resize',upd);upd()})();
/* ---------- install as app ---------- */
let dip=null;const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;insUi()});
addEventListener('appinstalled',()=>{dip=null;insUi()});
function insUi(){const b=$('#inb'),b2=$('#ins'),h=$('#inh');if(!b2)return;
 if(standalone()){b2.style.display='none';return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(dip){b.style.display='';h.style.display='none'}
 else if(ios){b.style.display='none';h.style.display='block';h.textContent='On iPhone: tap Share, then “Add to Home Screen”.'}
 else{b.style.display='';h.style.display='none'}}
async function installApp(){if(dip){dip.prompt();await dip.userChoice.catch(()=>{});dip=null;insUi()}else alert('Open your browser menu and choose “Install app” or “Add to Home screen”.')}
