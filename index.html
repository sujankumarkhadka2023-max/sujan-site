@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .sec>h2{color:#8fb4ff}}
.cat{font:700 13px/1.2 system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--ac)}

<script>
/* Privacy consent: asks before the site opens and decides which settings may be remembered on this device */
(function(){
 var KEY='sk_consent',ESS={sk_consent:1,sk_d:1},SET=Storage.prototype.setItem,pend=[];
 function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
 window.cnsDone=function(){return !!get()};
 window.cnsWait=function(f){if(get())f();else pend.push(f)};
 Storage.prototype.setItem=function(k,v){if(this===window.localStorage&&!ESS[k]){var c=get();if(c&&c.prefs===false)return}return SET.call(this,k,v)};
 function clean(){try{Object.keys(localStorage).forEach(function(k){if(!ESS[k])localStorage.removeItem(k)})}catch(e){}}
 function save(prefs){try{SET.call(localStorage,KEY,JSON.stringify({prefs:prefs,t:Date.now()}))}catch(e){}if(!prefs)clean();var o=document.getElementById('cns');if(o)o.remove();document.body.classList.remove('cnsopen');var q=pend.splice(0);q.forEach(function(f){try{f()}catch(e){}})}
 function main(){return '<div class="cs"><h2>We ask for your consent to remember your settings</h2>'+
  '<div class="pu"><span class="ic">&#9881;</span><span>Remember my choices on this device: theme, voice, horoscope sign and weather place</span></div>'+
  '<div class="pu"><span class="ic">&#9707;</span><span>Store and/or access information on a device</span></div>'+
  '<p>This site does not sell your data and has no tracking or advertising partners. If you consent, your choices (such as light/dark theme, reading voice, your horoscope sign and saved weather place) are saved in your browser so you don&rsquo;t have to set them again. Articles are also kept on your device so the site opens faster. Weather is fetched from open-meteo.com using only the place you pick.</p>'+
  '<p>You can change this at any time with <b>Privacy settings</b> at the bottom of any page. If you do not consent, the site still works but forgets your choices when you leave.</p></div>'+
  '<div class="ft"><button class="bt pr" data-a="y">Consent</button><button class="bt pr" data-a="n">Do not consent</button><button class="bt ln" data-a="m">Manage options</button></div>'}
 function manage(c){return '<div class="cs"><h2>Manage options</h2>'+
  '<div class="tg"><span><b>Essential</b><small>Keeps the latest articles on your device so pages open quickly. Always on.</small></span><input type="checkbox" checked disabled aria-label="Essential"></div>'+
  '<div class="tg"><label for="cnsP" style="flex:1"><b>Remember my choices</b><small>Theme, reading voice, horoscope sign and weather place.</small></label><input type="checkbox" id="cnsP" '+(!c||c.prefs!==false?'checked':'')+'></div></div>'+
  '<div class="ft"><button class="bt pr" data-a="s">Save my choices</button><button class="bt ln" data-a="b">Back</button></div>'}
 function show(){var c=get(),o=document.getElementById('cns');
  if(!o){o=document.createElement('div');o.id='cns';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','Privacy consent');o.innerHTML='<div class="cb"></div>';document.body.appendChild(o);document.body.classList.add('cnsopen');
   o.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
    if(a==='y')save(true);else if(a==='n')save(false);else if(a==='m')draw('m');else if(a==='b')draw('p');else if(a==='s')save(document.getElementById('cnsP').checked)})}
  function draw(v){o.firstChild.innerHTML=v==='m'?manage(c):main();}
  draw('p')}
 window.cnsOpen=show;
 function start(){if(!get()&&!/[?&]adprev=/.test(location.search))show()}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

<script>

function ratesInit(){const el=document.getElementById('rtc');if(!el)return;

 try{const c=JSON.parse(sessionStorage.getItem('sk_rt')||'null');if(c&&Date.now()-c.t<6e5){show(c.d);return}}catch(e){}
 fetch('/api/rates').then(r=>r.ok?r.json():Promise.reject()).then(d=>{try{sessionStorage.setItem('sk_rt',JSON.stringify({t:Date.now(),d}))}catch(e){}show(d)}).catch(()=>{})}

/* ---------- generated cover art: a unique abstract picture per title, used when a story has no photo ---------- */
let _art=0;
const ART_HUE={World:215,Opinion:338,History:28,Culture:40,Lifestyle:320};
function artHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function artRng(seed){let a=seed||1;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function art(a,sty){
 const title=String(a&&a.title||a&&a.id||'Story'),r=artRng(artHash(title.trim().toLowerCase())),n=++_art,
  hs=(h,s,l,o)=>`hsla(${Math.round(((h%360)+360)%360)},${s}%,${l}%,${o==null?1:o})`,f=v=>v.toFixed(1),

 let d=`<defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient><linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></linearGradient><radialGradient id="${id}s"><stop offset="0" stop-color="${gold}" stop-opacity=".95"/><stop offset=".45" stop-color="${gold}" stop-opacity=".25"/><stop offset="1" stop-color="${gold}" stop-opacity="0"/></radialGradient><filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter></defs><rect width="600" height="400" fill="url(#${id}g)"/>`;
 if(style===0){
  const sx=90+r()*420,sy=70+r()*80,sr=30+r()*34;d+=`<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr*3)}" fill="url(#${id}s)"/><circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr)}" fill="${gold}" opacity=".92"/>`;

   for(let x=0;x<=600;x+=15)p+=`L${x} ${f(y0+a1*Math.sin(x*k1*6.28+p1)+a2*Math.sin(x*k2*6.28+p2))}`;
   d+=`<path d="${p}L600 400Z" fill="${i%2?lt:ac}" opacity="${f(.16+i*.1)}"/>`}
 }else if(style===1){

  for(let i=1;i<=8;i++){const rr=i*38+r()*10;d+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rr)}" fill="none" stroke="${lt}" stroke-opacity="${f(.34-i*.03)}" stroke-width="${i%3?1.2:2}"${i%2?` stroke-dasharray="${2+Math.floor(r()*8)} ${5+Math.floor(r()*12)}"`:''}/>`}
  for(let i=0;i<4;i++){const rr=(2+Math.floor(r()*6))*38,an=r()*6.28,pr=6+r()*14;d+=`<circle cx="${f(cx+rr*Math.cos(an))}" cy="${f(cy+rr*Math.sin(an))}" r="${f(pr)}" fill="${i?ac:gold}" opacity=".95"/>`}
  d+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(16+r()*12)}" fill="${gold}"/>`;

const DEF={about:'Hello, I\'m Sujan Kumar Khadka.\n\nI\'m a student and lifelong learner committed to personal growth, continuous learning, and professional development. I enjoy exploring new ideas, developing my skills, and discovering opportunities to grow both personally and professionally.\n\nThis website is my personal space on the internet, where I share news, opinion, and culture and lifestyle.\n\nI believe that consistency, curiosity, and a willingness to learn are essential for long-term success.\n\nMy goal is simple: to keep learning, keep improving, and create something meaningful along the way.\n\nThank you for visiting my website.\n\nLearning today. Building for tomorrow.',contact:'We would be glad to hear from you. Whether you have a question, a news tip, feedback or a correction, please write to us by email.\n\nEmail: sujankumarkhadka56@gmail.com\n\nWHAT YOU CAN WRITE TO US ABOUT\nNews tips and story ideas\nCorrections and feedback on our stories\nQuestions about the website\nPrivacy enquiries\n\nWHEN YOU WRITE\nPlease include a clear subject line and, if you are writing about a story, the link or headline. We read every message and reply as soon as we can.\n\nWe use your email address and message only to reply to you.',support:'The Sujan Khadka is independent, free to read and free of advertising. Your support helps us keep it that way. There are simple ways to help, and every one of them matters.\n\nREAD AND SHARE\nShare stories you value with friends, family and on social media. Word of mouth is the strongest support an independent site can have.\n\nTELL US WHAT YOU THINK\nHonest feedback makes our stories better. Tell us what you liked, what we missed and what you would like to read next.\n\nSEND A TIP OR A CORRECTION\nIf you know about a story we should cover, or you spot a mistake, please write to us. Our Contact page has the details.\n\nINSTALL THE APP\nAdd the site to your home screen from the footer of any page. Recent stories open even with a weak internet connection.\n\nThank you for reading and for being part of The Sujan Khadka.',privacy:"The Sujan Khadka respects your privacy. This page explains what information is handled when you use this website.\n\nWHAT WE COLLECT\nReaders do not need an account, and the site does not ask for your name, email or other personal details. If you email us, we use your email address and message only to reply.\n\nTECHNICAL DATA\nOur hosting provider, Cloudflare, processes technical data such as IP address and browser type to deliver the site and keep it secure. We do not use this data to identify individual readers.\n\nADVERTISING AND TRACKING\nThis site does not run advertising or third-party tracking scripts.\n\nEXTERNAL LINKS\nStories may link to other websites. We are not responsible for their privacy practices.\n\nQUESTIONS\nFor privacy questions, contact: sujankumarkhadka56@gmail.com\n\nWe may update this page from time to time. The latest version is always published here.",cookies:"This website does not use cookies to track readers.\n\nLOCAL STORAGE\nTo load faster, your browser may keep a copy of recently published stories on your device. This contains only public stories and no personal information. You can clear it at any time in your browser settings.\n\nSIGN-IN COOKIE\nA secure sign-in cookie is used only by the site developer to manage content. Readers never receive it.\n\nOTHER WEBSITES\nSites we link to may use their own cookies, which we do not control.\n\nQUESTIONS\nContact: sujankumarkhadka56@gmail.com",terms:"By using The Sujan Khadka you agree to these terms.\n\nCONTENT\nStories, text and images published here belong to The Sujan Khadka unless stated otherwise. You may share links and quote short extracts with credit and a link back. Please do not republish full stories or images without written permission.\n\nOPINION AND ACCURACY\nWe aim to be accurate and fair. Opinion pieces reflect the views of their authors. Content is for general information and is not professional advice. If you find an error, please email us.\n\nUSE OF THE SITE\nPlease do not misuse the site, try to disrupt it, or try to reach areas that are not public.\n\nLINKS\nWe may link to other websites and are not responsible for their content.\n\nCHANGES\nWe may update these terms or the site at any time.\n\nCONTACT\nsujankumarkhadka56@gmail.com"};

 if(k.k==='sc')return `<div class="aem ${k.set?'scs':'sc'}"><iframe src="https://w.soundcloud.com/player/?url=${encodeURIComponent(k.u)}&color=%23${'8b1e2d'}&auto_play=false&show_teaser=false&visual=false" title="${T}" loading="lazy" allow="autoplay"></iframe></div>`;
 return `<div class="aem ia"><iframe src="https://archive.org/embed/${encodeURIComponent(k.id)}" title="${T}" loading="lazy" allowfullscreen></iframe></div>`}
function auCard(a){if(a.kind==='voice')return auVoiceCard(a);const k=auKind(a.url);if(!k)return'';
 if(k.k!=='file')return `<div class="ac emb" data-id="${esc(a.id)}"><div class="ai"><h3>${esc(a.title)}</h3>${a.desc?`<p class="ad1">${esc(a.desc)}</p>`:''}${auEmbed(k,a.title)}<div class="meta">${fd(a.date)}</div></div></div>`;
 return `<div class="ac" data-id="${esc(a.id)}"><button class="apl" onclick="auToggle('${esc(a.id)}')" aria-label="Play ${esc(a.title)}"><span></span></button><div class="ai"><h3>${esc(a.title)}</h3>${a.desc?`<p class="ad1">${esc(a.desc)}</p>`:''}<div class="abars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><input class="asr" type="range" min="0" max="1000" value="0" disabled aria-label="Seek" oninput="auSeek(this.value)"><div class="meta"><span class="at">0:00</span> / <span class="adu">${fmt(a.dur)}</span> · ${fd(a.date)}</div><div class="aer"></div></div></div>`}
function auToggle(id){const a=(D.audios||[]).find(x=>x.id===id);if(!a)return;
 if(auId===id){if(AU.paused)AU.play().catch(()=>auFail(id));else AU.pause();return}
 auStop();auId=id;auBad=null;AU.src=(auKind(a.url)||{u:a.url}).u;AU.play().catch(()=>auFail(id));auUi()}
function auStop(){if(auId===null)return;AU.pause();auId=null;AU.removeAttribute('src');AU.load();auUi()}
function auFail(id){if(id!==auId)return;auBad=id;AU.pause();auUi()}
function auSeek(v){if(isFinite(AU.duration))AU.currentTime=v/1000*AU.duration}
function auUi(){document.querySelectorAll('.ac:not(.emb)').forEach(c=>{const on=c.dataset.id===auId,pl=on&&!AU.paused&&!AU.ended;
 c.classList.toggle('aon',on);c.classList.toggle('aplay',pl);c.querySelector('.apl').setAttribute('aria-label',pl?'Pause':'Play');
 const sr=c.querySelector('.asr'),at=c.querySelector('.at'),du=c.querySelector('.adu'),er=c.querySelector('.aer');
 sr.disabled=!on;if(!on){sr.value=0;at.textContent='0:00'}else{at.textContent=fmt(AU.currentTime);if(isFinite(AU.duration)){du.textContent=fmt(AU.duration);sr.value=AU.currentTime/AU.duration*1000}}
 er.textContent=auBad&&on?'Could not play this audio. Please try again.':''})}
['play','pause','timeupdate','loadedmetadata','ended','error'].forEach(e=>AU.addEventListener(e,()=>{if(e==='error'&&auId&&AU.src)auBad=auId;auUi()}));
/* portal: upload + manage */
function audioTab(){const L=[...(A.audios||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)),e=(avEdit&&(A.audios||[]).find(a=>a.id===avEdit))||{};
 return `<div class="aup"><strong>${avEdit?'Edit audio':'Write audio'}</strong><p class="meta">Write or paste your text here. Visitors will not see the text. They will listen to it in a strong voice, with speed control and sharing.</p><label>Title</label><input id="av_t" value="${esc(e.title||'')}"><label>Short description (optional)</label><input id="av_d" value="${esc(e.desc||'')}"><label>Text to be spoken</label><textarea id="av_x" style="min-height:240px">${esc(e.text||'')}</textarea><button class="bt" onclick="avSave()">${avEdit?'Save changes':'Publish audio'}</button>${avEdit?'<button class="bt o" onclick="avEdit=null;go()">Cancel</button>':''}</div>`+
 `<details class="aup"><summary>Add audio by link (YouTube, SoundCloud, Internet Archive)</summary><p class="meta">Upload your audio to YouTube, SoundCloud or the Internet Archive, then paste its link here. Direct links to an MP3 / M4A / WAV file also work.</p><label>Title</label><input id="al_t" placeholder="Audio title"><label>Description (optional)</label><textarea id="al_d" style="min-height:70px"></textarea><label>Link</label><input id="al_u" type="url" inputmode="url" placeholder="https://…"><button class="bt" onclick="auAddLink()">Add audio</button></details>`+
 `<details class="aup"><summary>Or upload a small file (up to 10 MB)</summary><label>Title</label><input id="au_t" placeholder="Audio title"><label>Description (optional)</label><textarea id="au_d" style="min-height:70px"></textarea><label>Audio file — from your phone or computer</label><input type="file" id="au_f" accept="audio/*"><div class="apb"><i id="au_p"></i></div><button class="bt" id="au_b" onclick="auUpload()">Upload audio</button></details>`+
 (L.length?L.map(a=>{if(a.kind==='voice')return `<div class="row"><span><strong>${esc(a.title)}</strong><br><span class="meta">${a.status} · Voice audio · ${lt(a.text)} min · ${fd(a.date)}</span><br><a class="meta" href="/listen/${esc(a.id)}" target="_blank" rel="noopener">Open audio page</a></span><span><button class="bt o" onclick="avEditSet('${esc(a.id)}')">Edit</button><button class="bt o" onclick="auPub('${esc(a.id)}')">${a.status==='published'?'Unpublish':'Publish'}</button><button class="bt d" onclick="auDel('${esc(a.id)}')">Delete</button></span></div>`;
  const k=auKind(a.url);return `<div class="row"><span><strong>${esc(a.title)}</strong><br><span class="meta">${a.status} · ${k?AUK[k.k]:'Invalid link'}${a.dur?' · '+fmt(a.dur):''}${a.size?' · '+(a.size/1048576).toFixed(1)+' MB':''} · ${fd(a.date)}</span>${k&&k.k==='file'?`<br><audio controls preload="none" src="${esc(k.u)}" style="width:100%;max-width:340px;margin-top:6px"></audio>`:`<br><a class="meta" href="${esc(a.url)}" target="_blank" rel="noopener">Open original link</a>`}</span><span><button class="bt o" onclick="auPub('${esc(a.id)}')">${a.status==='published'?'Unpublish':'Publish'}</button><button class="bt d" onclick="auDel('${esc(a.id)}')">Delete</button></span></div>`}).join(''):'<div class="empty">No audio added yet.</div>')}
async function auAddLink(){const t=$('#al_t').value.trim(),u=$('#al_u').value.trim();
 if(!t)return alert('Please enter a title.');if(!u)return alert('Please paste a link.');
 if(/on\.soundcloud\.com/i.test(u))return alert('Please open the SoundCloud track and copy its full link (soundcloud.com/name/track), not the short link.');
 const k=auKind(u);if(!k)return alert('This link is not supported. Use a YouTube, SoundCloud or Internet Archive link, or a direct https link to an MP3 / M4A / WAV file.');
 A.audios=A.audios||[];A.audios.push({id:'u'+Date.now(),title:t,desc:$('#al_d').value.trim(),url:u,date:new Date().toISOString(),status:'published'});
 if(await persist())go()}
function putAudio(f,pg,dflt){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api/admin/upload');x.setRequestHeader('content-type',f.type||dflt||'audio/mpeg');
 x.upload.onprogress=e=>{if(e.lengthComputable)pg(Math.round(e.loaded/e.total*100))};
 x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText).url)}catch(e){no('the server gave an unexpected reply')}}else no('the server answered '+x.status)};
 x.onerror=()=>no('network error');x.send(f)})}
const auDur=f=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{ok(isFinite(a.duration)?Math.round(a.duration):0);URL.revokeObjectURL(u)};a.onerror=()=>{ok(0);URL.revokeObjectURL(u)};a.src=u});
async function auUpload(){const t=$('#au_t').value.trim(),f=$('#au_f').files[0];
 if(!t)return alert('Please enter a title.');if(!f)return alert('Please choose an audio file.');
 if(f.type&&!f.type.startsWith('audio/'))return alert('Please choose an audio file.');
 if(f.size>10e6)return alert('This file is '+(f.size/1e6).toFixed(1)+' MB. The limit is 10 MB (about 10 minutes of MP3). Please compress it or upload a shorter clip.');
 const b=$('#au_b'),bar=$('#au_p'),desc=$('#au_d').value.trim();b.disabled=true;b.textContent='Uploading…';
 try{const url=await putAudio(f,n=>{bar.style.width=n+'%';b.textContent='Uploading… '+n+'%'}),dur=await auDur(f);
  A.audios=A.audios||[];A.audios.push({id:'u'+Date.now(),title:t,desc,url,dur,size:f.size,date:new Date().toISOString(),status:'published'});
  if(await persist())go()}catch(e){alert('Audio upload failed: '+(e||'unknown error'));b.disabled=false;b.textContent='Upload audio'}}
async function auPub(id){const a=A.audios.find(x=>x.id===id);if(!a)return;a.status=a.status==='published'?'draft':'published';await persist();go()}
async function auDel(id){if(!confirm('Delete this audio from the website?'))return;A.audios=A.audios.filter(x=>x.id!==id);await persist();go()}
function share(){const d={title:document.title,url:location.href};if(navigator.share)navigator.share(d).catch(()=>{});else navigator.clipboard.writeText(d.url).then(()=>alert('Link copied'))}
addEventListener('popstate',()=>swap(go));

/* ---------- motion engine ---------- */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let io=null,navDir=0,lastCur=null,first=true,lastPath='';
function swap(fn){fn()}
function ddX(){document.querySelectorAll('.dd.open').forEach(d=>{d.classList.remove('open');d.firstElementChild.setAttribute('aria-expanded','false')})}
function ddT(b){const d=b.parentNode,o=!d.classList.contains('open');ddX();if(o){d.classList.add('open');b.setAttribute('aria-expanded','true')}}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))ddX()});addEventListener('keydown',e=>{if(e.key==='Escape')ddX()});
function words(el){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(tw.nextNode())ns.push(tw.currentNode);let i=0;
 ns.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}
  const w=document.createElement('span');w.className='wd';w.textContent=t;w.style.animationDelay=(i++*.06+.05)+'s';f.appendChild(w)});n.parentNode.replaceChild(f,n)})}
function countUp(el){const to=+el.dataset.n,t0=performance.now(),d=1500;(function f(t){const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}
function motion(){
 window.__upd&&window.__upd();
 const same=lastPath===location.pathname,m=$('#main');lastPath=location.pathname;
 const fst=first;first=false;
 if(RM||same||!('IntersectionObserver' in window))return;
 if(m&&!fst){m.style.setProperty('--dx',navDir+'px');m.classList.add('mi')}
 document.querySelectorAll('main h1').forEach(h=>{if(!h.querySelector('.wd'))words(h)});
 io&&io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add('in');if(t.classList.contains('stats'))t.querySelectorAll('[data-n]').forEach(countUp);io.unobserve(t)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
 document.querySelectorAll('main .stats').forEach(st=>{st.querySelectorAll('[data-n]').forEach(n=>n.textContent='0');st.classList.add('rv');io.observe(st)});
 document.querySelectorAll('main .sec').forEach(sec=>{sec.classList.add('rv');io.observe(sec);
  sec.querySelectorAll('.card').forEach((c,i)=>{c.classList.add('rv');c.style.setProperty('--d',(i%4)*.09+'s');io.observe(c)})});
 document.querySelectorAll('main .lead>*, main article>*, main .pg>:not(h1)').forEach((c,i)=>{c.classList.add('rv');c.style.setProperty('--d',Math.min(i,6)*.07+'s');io.observe(c)})}
/* theme toggle */
function effTheme(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function thUi(){const b=$('#thm');if(b)b.textContent=effTheme()==='dark'?'☀ Light':'☾ Dark'}
function toggleTheme(){const h=document.documentElement,n=effTheme()==='dark'?'light':'dark';h.classList.add('tx');h.setAttribute('data-theme',n);try{localStorage.setItem('sk_theme',n)}catch(e){}thUi();setTimeout(()=>h.classList.remove('tx'),700)}
/* progress bar, sticky nav, back-to-top, header parallax */
(function(){const pg=document.createElement('div');pg.id='pg';const bt=document.createElement('button');bt.id='btt';bt.setAttribute('aria-label','Back to top');
 bt.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
 bt.onclick=()=>scrollTo({top:0,behavior:RM?'auto':'smooth'});document.body.append(pg,bt);
 let t=0;const upd=()=>{t=0;const y=scrollY,ar=document.querySelector('article');let p;
  if(ar){const r=ar.getBoundingClientRect(),tot=r.height-innerHeight*.55;p=tot>0?-r.top/tot:0}else{const h=document.documentElement.scrollHeight-innerHeight;p=h>0?y/h:0}
  pg.style.transform='scaleX('+Math.max(0,Math.min(1,p))+')';
  const nb=document.querySelector('.nb');if(nb)nb.classList.toggle('sc',y>90);bt.classList.toggle('show',y>500);
  if(!RM){const i=document.querySelector('.hd img');if(i&&y<400)i.style.objectPosition='right calc(50% + '+y*.08+'px)'}};
 window.__upd=upd;addEventListener('scroll',()=>{if(!t)t=requestAnimationFrame(upd)},{passive:true});addEventListener('resize',upd);upd()})();
/* ---------- install as app ---------- */
let dip=null;const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;insUi()});
addEventListener('appinstalled',()=>{dip=null;insUi()});
function insUi(){const b=$('#inb'),b2=$('#ins'),h=$('#inh');if(!b2)return;
 if(standalone()){b2.style.display='none';return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(dip){b.style.display='';h.style.display='none'}
 else if(ios){b.style.display='none';h.style.display='block';h.textContent='On iPhone: tap Share, then “Add to Home Screen”.'}
 else{b.style.display='';h.style.display='none'}}
async function installApp(){if(dip){dip.prompt();await dip.userChoice.catch(()=>{});dip=null;insUi()}else alert('Open your browser menu and choose “Install app” or “Add to Home screen”.')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
try{if(matchMedia('(max-width:820px)').matches||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4)document.documentElement.classList.add('lite')}catch(e){}
if(location.hash.startsWith('#/'))history.replaceState(null,'',location.hash.slice(1));
try{const c=JSON.parse(localStorage.getItem('sk_d'));if(c&&c.articles){D=fixCats(c);ready=true}}catch(e){}
go();
const pub_=()=>location.pathname.split('/')[1]!=='developer';
if(ready===true)adInit(false);
wxLoad();setInterval(wxLoad,12e5);
fetch('/api/data').then(r=>r.json()).then(x=>{const t=JSON.stringify(x);let o=null;try{o=localStorage.getItem('sk_d')}catch(e){}
 if(!ready||t!==o){D=fixCats(x);ready=true;if(pub_())go()}try{localStorage.setItem('sk_d',t)}catch(e){}adFresh=true;adInit(true)}).catch(()=>{if(!ready){ready='err';if(pub_())go()}});
