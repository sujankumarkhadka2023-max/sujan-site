<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sujan Kumar Khadka</title>
<style>
:root{--site-width:1200px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000}
body{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.7}
a{color:#000}
.site{max-width:var(--site-width);margin:0 auto;background:#fff}
.site>header img{display:block;width:100%;height:auto}
nav{display:flex;flex-wrap:wrap;justify-content:center;border-top:1px solid #000;border-bottom:1px solid #000}
nav a,nav button{flex:1 1 auto;text-align:center;padding:14px 10px;border:0;background:#fff;color:#000;font:700 15px Georgia,serif;text-decoration:none;cursor:pointer}
nav .on{border-bottom:3px solid #000}
main{padding:24px 20px 40px;min-height:50vh}
footer{border-top:1px solid #000;text-align:center;padding:16px;font-size:14px}
.note{text-align:center;padding:40px 0}
.card{display:block;text-decoration:none;padding:22px 0;border-bottom:1px solid #000}
.card img{display:block;width:100%;max-height:420px;object-fit:cover;margin-bottom:12px}
.card h2,.full h1{font-weight:700;margin:4px 0 6px;line-height:1.3}
.card h2{font-size:24px}
.full h1{font-size:32px}
.meta{font-size:14px}
.full img{display:block;width:100%;height:auto;margin:16px 0}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
a.btn{display:inline-block;text-decoration:none}
.sh{margin-top:28px;padding-top:16px;border-top:1px solid #000}
.more{text-align:center;padding:24px 0 0}
.btn{padding:12px 26px;border:1px solid #000;background:#000;color:#fff;font:700 16px Georgia,serif;cursor:pointer}
.btn.alt{background:#fff;color:#000}
.btn:disabled{opacity:.5}
label{display:block;margin:16px 0 4px;font-weight:700}
input[type=text],input[type=password],textarea{width:100%;padding:10px;border:1px solid #000;border-radius:0;background:#fff;color:#000;font:16px Georgia,serif}
textarea{min-height:260px;resize:vertical}
textarea.s{min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cr{display:flex;gap:8px;margin-top:8px}
.cr input{flex:1}
.msg{min-height:1.4em;font-weight:700}
.prev{max-width:320px;margin-top:10px}
.prev img{display:block;width:100%}
.dp{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #000;padding:12px 0;flex-wrap:wrap}
.dp b{flex:1 1 200px;overflow-wrap:anywhere}
.cl dt{font-weight:700;margin-top:14px}
.cl dd{margin:0}
.box{max-width:420px;margin:30px auto}
@media(max-width:600px){main{padding:18px 14px 30px}.full h1{font-size:26px}}

:root{--accent:#d0121b;--grey:#666}
.dateline{text-align:right;font:italic 13px Georgia,serif;color:var(--grey);padding:8px 20px}
nav{border-top:3px solid #000}
nav a,nav button{text-transform:uppercase;letter-spacing:.14em;font-size:13px;padding:15px 10px}
nav a:hover,nav button:hover{color:var(--accent)}
nav .on{border-bottom:3px solid var(--accent)}
.meta{font-size:12px}
.tag{color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-right:8px}
.dt{color:var(--grey);font-size:13px}
#list{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;align-items:start}
.card{border-top:3px solid #000;border-bottom:0;padding:14px 0 22px}
.card img{aspect-ratio:16/10;max-height:none}
.card h2{font-size:23px;line-height:1.25}
.card:hover h2{text-decoration:underline}
.card .ex{color:#222;font-size:16px}
.feat{grid-column:1/-1}
.feat img{aspect-ratio:21/9}
.feat h2{font-size:38px}
.full{max-width:760px;margin:0 auto}
.full h1{font-size:40px;line-height:1.2;border-bottom:1px solid #000;padding-bottom:14px}
.full .text{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.6;letter-spacing:normal;word-spacing:normal}
.full .text{white-space:normal;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;line-height:1.6;overflow-wrap:break-word}
.full .text p{margin:0 0 20px}
.by{font-weight:700;font-size:15px;margin:10px 0 0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.pi{position:relative}
.pi img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pi button{position:absolute;top:4px;right:4px;width:28px;height:28px;padding:0;border:0;background:#000;color:#fff;font:700 18px/28px Georgia,serif;cursor:pointer}
.sm{font-weight:700;color:var(--accent);white-space:nowrap}
.card .ex{text-align:justify;hyphens:auto;-webkit-hyphens:auto;line-height:1.7}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.shw{position:relative}
.ib{border:0;background:#fff;color:#000;padding:8px;cursor:pointer;line-height:0}
.ib svg{width:26px;height:26px}
.menu{position:absolute;right:0;top:100%;min-width:210px;background:#fff;border:1px solid #000;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}
.menu a,.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border:0;background:#fff;color:#000;font:16px Georgia,serif;text-decoration:none;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:#f2f2f2}
.menu svg{width:22px;height:22px;flex:none}
.menu{width:240px;min-width:0}
.ig{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:18px 14px 16px}
.menu .ig a{width:52px;height:52px;padding:0;border-radius:50%;justify-content:center;color:#fff}
.menu .ig a:hover{opacity:.85}
.ig svg{width:32px;height:32px}
.menu .cp{border-top:1px solid #000;justify-content:center;font-weight:700;padding:14px 16px}
select{padding:10px;border:1px solid #000;border-radius:0;background:#fff;color:#000;font:16px Georgia,serif}
.cr select{flex:0 0 132px}
.ck{display:flex;align-items:center;gap:10px;font-weight:700}
.ck input{width:22px;height:22px;accent-color:#000}
.ch{font-size:14px;letter-spacing:.14em;text-transform:uppercase;border-top:3px solid #000;padding-top:10px;margin:34px 0 14px}
.soc{display:flex;flex-wrap:wrap;gap:12px}
.soc a{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.soc svg{width:28px;height:28px}
.map iframe{display:block;width:100%;height:320px;border:1px solid #000}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.dm{border-top:3px solid #000;padding:14px 0 18px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.hint{font-size:14px;color:#555;margin:6px 0 0}
footer{padding:0;border-top:3px solid #000;text-align:left}
.fa{padding:22px 20px 10px;max-width:760px;margin:0 auto}
.fa h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px}
.fa .text{font-size:16px;line-height:1.7;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.fa .text p{margin:0 0 12px}
.soc.fs{justify-content:center;padding:14px 20px}
.fs a{width:42px;height:42px}
.fs svg{width:24px;height:24px}
.fb{border-top:1px solid #000;padding:14px 20px;font-size:14px;text-align:center}
.ub{display:flex;justify-content:center;padding:6px 20px 22px}
.fw{border-top:1px solid #000}
.up{display:inline-flex;align-items:center;gap:8px;border:1px solid #000;background:#000;color:#fff;font:700 14px Georgia,serif;padding:9px 16px;cursor:pointer}
.up svg{width:18px;height:18px}
@media(max-width:700px){#list{grid-template-columns:1fr}.feat h2{font-size:28px}.feat img{aspect-ratio:16/10}.full h1{font-size:29px}.full .text{font-size:18px}}
</style>
</head>
<body>
<div class="site">
<header><img src="/header.png" alt="Sujan Kumar Khadka"></header>
<div class="dateline" id="dl"></div>
<nav id="nav"></nav>
<main id="view"></main>
<footer id="ft"></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const view = $('#view'), navEl = $('#nav');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = {article:'Article', opinion:'Opinion'}, PAGE = 4, KEY = 'sk_token';
$('#dl').textContent = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmt = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
const imgUrl = p => '/img/' + encodeURIComponent(String(p).split('/').pop());

async function api(path, opts = {}) {
  const headers = {};
  const t = localStorage.getItem(KEY);
  if (t) headers.Authorization = 'Bearer ' + t;
  if (opts.body) headers['Content-Type'] = 'application/json';
  let res;
  try { res = await fetch(path, {...opts, headers, cache:'no-store'}); }
  catch (e) { throw new Error('Network error. Check your internet connection.'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || 'Request failed (' + res.status + ').'); err.status = res.status; throw err; }
  return data;
}

/* ---------- public site ---------- */
function setNav(active) {
  const l = [['home','Home','#/'],['opinion','Opinion','#/opinion'],['article','Article','#/article'],['contact','Contact','#/contact']];
  navEl.innerHTML = l.map(x => `<a href="${x[2]}" class="${x[0]===active?'on':''}">${x[1]}</a>`).join('');
}
async function loadPosts(kind) {
  const kinds = kind === 'home' ? ['article','opinion'] : [kind];
  const r = await Promise.allSettled(kinds.map(k => api('/api/data/' + k)));
  if (r.every(x => x.status === 'rejected')) throw new Error('unavailable');
  let all = [];
  r.forEach((x, i) => { if (x.status === 'fulfilled') all = all.concat(x.value.map(p => ({...p, section: kinds[i]}))); });
  return all.sort((a, b) => new Date(b.date) - new Date(a.date));
}
const paras = b => String(b || '').split(/\n+/).map(s => s.trim()).filter(Boolean).map(s => `<p>${esc(s)}</p>`).join('');
function card(p, feat) {
  const im = (p.images && p.images[0]) || p.image;
  const flat = p.body.replace(/\s+/g, ' ').trim(), cut = flat.length > 260;
  const ex = cut ? flat.slice(0, 260).replace(/\s+\S*$/, '') + '…' : flat;
  return `<a class="card${feat ? ' feat' : ''}" href="#/${p.section}/${esc(p.id)}">${im ? `<img src="${imgUrl(im)}" alt="" loading="lazy">` : ''}<div class="meta"><span class="tag">${LABEL[p.section]}</span><span class="dt">${fmt(p.date)}${p.author ? ' · ' + esc(p.author) : ''}</span></div><h2>${esc(p.title)}</h2><div class="ex">${esc(ex)}${cut ? ' <span class="sm">See more</span>' : ''}</div></a>`;
}
async function showList(kind) {
  view.innerHTML = '<p class="note">Loading…</p>';
  let items;
  try { items = await loadPosts(kind); }
  catch (e) { view.innerHTML = '<p class="note">Content is unavailable right now. Please try again later.</p>'; return; }
  if (!items.length) { view.innerHTML = '<p class="note">Nothing has been published yet.</p>'; return; }
  view.innerHTML = '<div id="list"></div><div class="more"><button class="btn" id="more">See more</button></div>';
  let shown = 0;
  const list = $('#list'), btn = $('#more');
  const next = () => {
    items.slice(shown, shown + PAGE).forEach((p, i) => list.insertAdjacentHTML('beforeend', card(p, shown + i === 0)));
    shown += PAGE;
    btn.parentElement.style.display = shown >= items.length ? 'none' : '';
  };
  btn.onclick = next; next();
}
async function showPost(section, id) {
  view.innerHTML = '<p class="note">Loading…</p>';
  try {
    const p = (await api('/api/data/' + section)).find(x => x.id === id);
    if (!p) { view.innerHTML = '<p class="note">This page was not found.</p>'; return; }
    const imgs = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
    view.innerHTML = `<article class="full"><div class="top"><div class="meta"><span class="tag">${LABEL[section]}</span><span class="dt">${fmt(p.date)}</span></div><div class="shw"><button class="ib" id="shb" aria-label="Share" title="Share">${ICON.share}</button><div class="menu" id="mn" hidden></div></div></div><h1>${esc(p.title)}</h1>${p.author ? `<div class="by">By ${esc(p.author)}</div>` : ''}${imgs[0] ? `<img src="${imgUrl(imgs[0])}" alt="">` : ''}<div class="text">${paras(p.body)}</div>${imgs.slice(1).map(i => `<img src="${imgUrl(i)}" alt="" loading="lazy">`).join('')}</article>`;
    shareButtons(section, p);
  } catch (e) { view.innerHTML = '<p class="note">Content is unavailable right now. Please try again later.</p>'; }
}
function linkValue(v) {
  const t = v.trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t)) return `<a href="mailto:${esc(t)}">${esc(t)}</a>`;
  if (/^https?:\/\//i.test(t)) return `<a href="${esc(t)}" target="_blank" rel="noopener">${esc(t)}</a>`;
  if (/^\+?[\d\s\-()]{7,}$/.test(t)) return `<a href="tel:${esc(t.replace(/[^\d+]/g, ''))}">${esc(t)}</a>`;
  return esc(t);
}
const ICON = {
  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="currentColor"/><circle cx="6" cy="12" r="3" fill="currentColor"/><circle cx="18" cy="19" r="3" fill="currentColor"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  fb:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M13.5 21v-7.5h2.6l.4-3h-3V8.7c0-.9.3-1.5 1.6-1.5h1.6V4.5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.1H8v3h2.6V21h2.9z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M17.5 3.5h3l-6.6 7.600L21.700 20.500h-6.100l-4.800-6.200-5.500 6.200H2.300l7.100-8.100L2 3.500h6.200l4.300 5.700 5-5.700zm-1.100 15.300h1.700L7.400 5.200H5.600l10.800 13.600z"/></svg>',
  wa:'<svg viewBox="0 0 24 24"><path d="M12 3.200a8.800 8.800 0 0 0-7.600 13.200L3.200 20.800l4.500-1.200A8.800 8.800 0 1 0 12 3.200z" fill="none" stroke="#fff" stroke-width="1.900" stroke-linejoin="round"/><path fill="#fff" d="M8.800 8.300c0 3.500 2.900 6.400 6.400 6.400l1-1.500-1.900-1-.9.800c-1-.4-1.900-1.300-2.300-2.300l.8-.9-1-1.900-2.100 1.400z"/></svg>',
  ms:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3C7 3 3.200 6.700 3.200 11.300c0 2.600 1.200 4.900 3.200 6.400V21l3-1.700c.8.200 1.600.3 2.600.3 5 0 8.800-3.700 8.800-8.300S17 3 12 3z"/><path fill="#1c8bf2" d="M6.700 14l3.300-5.100 2.600 2.600 3.100-2.600-3.300 5.100-2.600-2.600L6.700 14z"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12.100 3.200c-4.900 0-7.400 3.300-7.400 6.200 0 1.700.7 3.200 2 3.700.2.100.4 0 .5-.2l.2-.8c.1-.2 0-.3-.1-.5-.4-.5-.7-1.100-.7-2 0-2.600 1.900-4.900 5.100-4.900 2.800 0 4.300 1.700 4.300 4 0 3-1.300 5.500-3.300 5.500-1.100 0-1.900-.9-1.600-2 .3-1.300.9-2.700.9-3.600 0-.8-.4-1.500-1.400-1.500-1.100 0-2 1.200-2 2.700 0 1 .3 1.600.3 1.600l-1.300 5.500c-.3 1.300-.2 3 0 4.100.1.100.3.200.4 0 .5-.7 1.600-2.100 2-3.700l.7-2.800c.4.700 1.400 1.200 2.500 1.200 3.300 0 5.600-3 5.600-6.800 0-2.900-2.400-5.700-6.700-5.700z"/></svg>',
  vb:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M5.200 4.200C4 5.200 3.800 6.900 4.600 9c1.500 4.100 5.400 8.200 9.800 10 1.800.7 3.100.4 4-.5l.7-.9c.3-.4.3-.9 0-1.200l-2-1.600c-.4-.3-.9-.3-1.200.1l-.8.9c-1.900-.8-3.700-2.600-4.500-4.500l.9-.8c.4-.3.4-.8.1-1.200l-1.600-2c-.3-.4-.8-.5-1.200-.2l-.6.100z"/><path d="M13.200 6.500a4.500 4.500 0 0 1 4 4M13.200 3.500a7.500 7.500 0 0 1 7.300 7.200" stroke="#fff" stroke-width="1.700" fill="none" stroke-linecap="round"/></svg>'
,
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4.500" y="4.500" width="15" height="15" rx="4.500"/><circle cx="12" cy="12" r="3.500"/><circle cx="16.800" cy="7.200" r="1" fill="#fff" stroke="none"/></svg>',
  yt:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3.500" fill="#fff"/><path d="M10 9.200v5.600l5-2.800z" fill="#ff0000"/></svg>',
  li:'<svg viewBox="0 0 24 24"><text x="12" y="16.500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="12.500" fill="#fff">in</text></svg>',
  tg:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M20.700 4.200L3.400 10.900c-.9.300-.9 1.100 0 1.400l4.200 1.300 1.600 5c.2.600.8.800 1.300.400l2.300-1.900 4.200 3.100c.5.300 1.100.1 1.200-.5L21.900 5.500c.2-.8-.5-1.500-1.200-1.300zM9 13.300l8.300-5.200-6.500 6.200-.3 2.600L9 13.300z"/></svg>'
};
ICON.up = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const SOC = {
  facebook:['Facebook','#4f6fa6','fb'], x:['X','#000','x'], whatsapp:['WhatsApp','#2fb67b','wa'], messenger:['Messenger','#1c8bf2','ms'],
  pinterest:['Pinterest','#e60000','pin'], viber:['Viber','#8b6aa6','vb'], instagram:['Instagram','linear-gradient(45deg,#f09433,#dc2743,#bc1888)','ig'],
  youtube:['YouTube','#ff0000','yt'], linkedin:['LinkedIn','#0a66c2','li'], telegram:['Telegram','#2aa3dd','tg']
};
function socialHref(type, v) {
  v = String(v || '').trim();
  if (/^(https?:\/\/|viber:\/\/)/i.test(v)) return v;
  const d = v.replace(/\D/g, ''), u = v.replace(/^@/, '');
  if (type === 'whatsapp') return d ? 'https://wa.me/' + d : '';
  if (type === 'viber') return d ? 'viber://chat?number=%2B' + d : '';
  if (type === 'youtube') return /^@?[\w.\-]+$/.test(v) ? 'https://youtube.com/' + (v[0] === '@' ? v : '@' + v) : '';
  const base = {facebook:'https://facebook.com/', x:'https://x.com/', messenger:'https://m.me/', pinterest:'https://pinterest.com/', instagram:'https://instagram.com/', linkedin:'https://linkedin.com/in/', telegram:'https://t.me/'}[type];
  return base && /^[\w.\-\/]+$/.test(u) ? base + u : '';
}
function shareButtons(section, p) {
  const url = location.origin + '/share/' + section + '/' + encodeURIComponent(p.id);
  const u = encodeURIComponent(url), t = encodeURIComponent(p.title);
  const first = (p.images && p.images[0]) || p.image;
  const media = encodeURIComponent(location.origin + (first ? imgUrl(first) : '/header.png'));
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const L = [
    ['Facebook', '#4f6fa6', ICON.fb, 'https://www.facebook.com/sharer/sharer.php?u=' + u, 1],
    ['X', '#000', ICON.x, 'https://twitter.com/intent/tweet?text=' + t + '&url=' + u, 1],
    ['WhatsApp', '#2fb67b', ICON.wa, 'https://wa.me/?text=' + t + '%20' + u, 1],
    ['Messenger', '#1c8bf2', ICON.ms, 'fb-messenger://share/?link=' + u, 0],
    ['Pinterest', '#e60000', ICON.pin, 'https://pinterest.com/pin/create/button/?url=' + u + '&media=' + media + '&description=' + t, 1],
    ['Viber', '#8b6aa6', ICON.vb, 'viber://forward?text=' + t + '%20' + u, 0]
  ].filter(x => mobile || x[0] !== 'Messenger');
  const btn = $('#shb'), mn = $('#mn');
  mn.innerHTML = `<div class="ig">${L.map(x => `<a href="${x[3].replace(/&/g, '&amp;')}"${x[4] ? ' target="_blank" rel="noopener"' : ''} aria-label="${x[0]}" title="${x[0]}" style="background:${x[1]}">${x[2]}</a>`).join('')}</div><button class="cp" id="shc">${ICON.link}<span>Copy link</span></button>`;
  btn.onclick = ev => { ev.stopPropagation(); mn.hidden = !mn.hidden; };
  mn.onclick = ev => ev.stopPropagation();
  document.onclick = () => { mn.hidden = true; };
  mn.querySelectorAll('a').forEach(a => a.onclick = () => setTimeout(() => { mn.hidden = true; }, 150));
  $('#shc').onclick = async () => {
    const s = $('#shc span');

}
const formHtml = `<h2 class="ch">Send a message</h2><form id="mf"><label for="fn">Name</label><input type="text" id="fn" maxlength="100" autocomplete="name" required><label for="fe">Email (optional)</label><input type="text" id="fe" maxlength="200" inputmode="email" autocomplete="email"><label for="fp">Phone (optional)</label><input type="text" id="fp" maxlength="40" inputmode="tel" autocomplete="tel"><label for="fm">Message</label><textarea id="fm" maxlength="3000" style="min-height:160px" required></textarea><div class="hp" aria-hidden="true"><label>Website<input type="text" id="fw" tabindex="-1" autocomplete="off"></label></div><div class="row"><button class="btn" type="submit" id="fs">Send message</button></div><p class="msg" id="fg"></p></form>`;

  $('#mf').onsubmit = async ev => {

      $('#mf').outerHTML = '<p class="msg">Thank you. Your message has been sent.</p>';
    } catch (e) { bt.disabled = false; mg.textContent = e.message; }

}
function renderFooter(c) {

  if (social.length) out += `<div class="soc fs">${social.map(s => `<a href="${esc(socialHref(s.type, s.url))}" target="_blank" rel="noopener" aria-label="${SOC[s.type][0]}" title="${SOC[s.type][0]}" style="background:${SOC[s.type][1]}">${ICON[SOC[s.type][2]]}</a>`).join('')}</div>`;
  out += `<div class="ub"><button class="up" id="up" type="button" aria-label="Back to top">${ICON.up}<span>Back to top</span></button></div>`;

  out += `<div class="fb">&copy; ${new Date().getFullYear()} Sujan Kumar Khadka</div>`;
  $('#ft').innerHTML = out;
  $('#up').onclick = () => window.scrollTo({top:0, behavior:'smooth'});
}
const loadFooter = () => api('/api/data/contact').then(renderFooter).catch(() => renderFooter({}));
async function showContact() {
  view.innerHTML = '<p class="note">Loading…</p>';
  let c;
  try { c = await api('/api/data/contact'); }
  catch (e) { view.innerHTML = '<p class="note">Content is unavailable right now. Please try again later.</p>'; return; }
  const items = c.items || [], social = (c.social || []).filter(s => SOC[s.type] && socialHref(s.type, s.url));
  if (!c.intro && !items.length && !social.length && !c.mapQuery && !c.formOn) { view.innerHTML = '<p class="note">Contact details have not been added yet.</p>'; return; }
  let out = '<div class="full">';
  if (c.intro) out += `<div class="text">${paras(c.intro)}</div>`;

  if (social.length) out += `<h2 class="ch">Follow</h2><div class="soc">${social.map(s => `<a href="${esc(socialHref(s.type, s.url))}" target="_blank" rel="noopener" aria-label="${SOC[s.type][0]}" title="${SOC[s.type][0]}" style="background:${SOC[s.type][1]}">${ICON[SOC[s.type][2]]}</a>`).join('')}</div>`;
  if (c.mapQuery) {
    const q = encodeURIComponent(c.mapQuery);
    out += `<h2 class="ch">Find us</h2><div class="map"><iframe src="https://www.google.com/maps?q=${q}&amp;output=embed" loading="lazy" title="Map"></iframe></div><p><a href="https://www.google.com/maps/search/?api=1&amp;query=${q}" target="_blank" rel="noopener">Open in Google Maps</a></p>`;
  }
  if (c.formOn) out += formHtml;
  view.innerHTML = out + '</div>';
  if (c.formOn) initForm();

/* ---------- developer portal ---------- */
function resizeImage(file, max = 1600) {
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const w = Math.round(im.width * s), h = Math.round(im.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = () => { URL.revokeObjectURL(url); bad(new Error('This file could not be read as an image.')); };
    im.src = url;
  });
}
function devFail(e, el) {
  if (e.status === 401) { localStorage.removeItem(KEY); showLogin(e.message); return; }
  el.textContent = e.message;
}
function showLogin(message) {
  navEl.innerHTML = '';
  view.innerHTML = `<form class="box" id="lf"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required><div class="row"><button class="btn" type="submit">Log in</button></div><p class="msg" id="lm"></p></form>`;
  $('#lm').textContent = message || '';
  $('#lf').onsubmit = async ev => {
    ev.preventDefault();
    const m = $('#lm'); m.textContent = '';
    try {
      const r = await api('/api/login', {method:'POST', body:JSON.stringify({password:$('#pw').value})});
      localStorage.setItem(KEY, r.token); showDash('article');
    } catch (e) { m.textContent = e.message; }
  };
}
function showDash(tab) {
  if (!localStorage.getItem(KEY)) return showLogin();
  const tabs = [['article','Articles'],['opinion','Opinions'],['contact','Contact'],['messages','Messages'],['setup','Check setup']];
  navEl.innerHTML = tabs.map(t => `<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('') + '<button data-t="out">Log out</button>';
  navEl.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.t === 'out') { localStorage.removeItem(KEY); showLogin(); } else showDash(b.dataset.t);
  });
  api('/api/messages').then(l => { const n = l.filter(m => !m.read).length, b = navEl.querySelector('[data-t="messages"]'); if (n && b) b.textContent = 'Messages (' + n + ')'; }).catch(() => {});
  if (tab === 'messages') return devMessages();
  if (tab === 'contact') return devContact();
  if (tab === 'setup') return devSetup();
  devSection(tab);
}
async function devSection(section) {
  view.innerHTML = `<h2>${LABEL[section]}</h2><div id="ed"></div><h2 style="margin-top:36px">Published</h2><div id="pl"><p class="note">Loading…</p></div>`;
  editor(section, null);
  try {
    const list = await api('/api/data/' + section);
    const pl = $('#pl');
    if (!list.length) { pl.innerHTML = '<p>Nothing published yet.</p>'; return; }
    pl.innerHTML = list.map(p => `<div class="dp"><b>${esc(p.title)}</b><span><button class="btn alt" data-e="${esc(p.id)}">Edit</button> <button class="btn alt" data-d="${esc(p.id)}">Delete</button></span></div>`).join('');
    pl.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { editor(section, list.find(p => p.id === b.dataset.e)); window.scrollTo(0, 0); });
    pl.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
      if (!confirm('Delete this post permanently?')) return;
      try { await api(`/api/post/${section}/${b.dataset.d}`, {method:'DELETE'}); devSection(section); }
      catch (e) { devFail(e, $('#pl')); }
    });
  } catch (e) { devFail(e, $('#pl')); }
}
function editor(section, post) {
  const MAX = 10;
  const items = (post ? (post.images && post.images.length ? post.images : (post.image ? [post.image] : [])) : []).map(p => ({path: p}));
  $('#ed').innerHTML = `<form id="pf"><label for="t">Heading</label><input type="text" id="t" maxlength="200" style="font-weight:700" required><label for="au">Author name (optional)</label><input type="text" id="au" maxlength="100"><label for="b">Full News</label><textarea id="b" required></textarea><label for="f">Images (optional, up to 10, from phone or computer)</label><input type="file" id="f" accept="image/*" multiple><div class="pg" id="pv"></div><div class="row"><button class="btn" type="submit" id="sv">${post ? 'Save changes' : 'Publish'}</button>${post ? '<button class="btn alt" type="button" id="cn">Cancel</button>' : ''}</div><p class="msg" id="mg"></p></form>`;
  $('#t').value = post ? post.title : '';
  $('#au').value = post ? post.author || '' : '';
  $('#b').value = post ? post.body : '';
  const paint = () => {
    $('#pv').innerHTML = items.map((it, i) => `<div class="pi"><img src="${esc(it.data || imgUrl(it.path))}" alt=""><button type="button" data-i="${i}" aria-label="Remove image">×</button></div>`).join('');
    $('#pv').querySelectorAll('button').forEach(b => b.onclick = () => { items.splice(+b.dataset.i, 1); paint(); });
  };
  paint();
  if (post) $('#cn').onclick = () => editor(section, null);
  $('#f').onchange = async ev => {
    const files = [...ev.target.files]; ev.target.value = '';
    const mg = $('#mg'); mg.textContent = '';
    for (const f of files) {
      if (items.length >= MAX) { mg.textContent = 'Maximum ' + MAX + ' images.'; break; }
      try { items.push({data: await resizeImage(f)}); } catch (e) { mg.textContent = e.message; }
    }
    paint();
  };
  $('#pf').onsubmit = async ev => {
    ev.preventDefault();
    const mg = $('#mg'), sv = $('#sv'); sv.disabled = true; mg.textContent = 'Saving…';
    try {
      const todo = items.filter(i => !i.path); let n = 0;
      for (const it of todo) {
        mg.textContent = `Uploading image ${++n} of ${todo.length}…`;
        const r = await api('/api/upload', {method:'POST', body:JSON.stringify({type:'image/jpeg', data: it.data.split(',')[1]})});
        it.path = r.image; delete it.data;
      }
      mg.textContent = 'Saving…';
      await api('/api/post/' + section, {method:'POST', body:JSON.stringify({id: post ? post.id : undefined, title:$('#t').value, author:$('#au').value, body:$('#b').value, images: items.map(i => i.path)})});
      devSection(section);
    } catch (e) { sv.disabled = false; devFail(e, mg); }
  };
}
async function devContact() {
  view.innerHTML = '<h2>Contact</h2><p class="note">Loading…</p>';
  let c;
  try { c = await api('/api/data/contact'); } catch (e) { view.innerHTML = '<p class="msg" id="mg"></p>'; return devFail(e, $('#mg')); }
  const opts = Object.keys(SOC).map(k => `<option value="${k}">${SOC[k][0]}</option>`).join('');
  view.innerHTML = `<h2>Contact</h2><form id="cf"><label for="ci">Message at the top</label><textarea class="s" id="ci"></textarea><label>Details (email, phone, address, opening hours…)</label><div id="ri"></div><div class="row"><button class="btn alt" type="button" id="ad">Add detail</button></div><label for="ab">About (shown at the bottom of every page)</label><textarea class="s" id="ab"></textarea><label>Social links (also shown at the bottom of every page)</label><div id="si"></div><div class="row"><button class="btn alt" type="button" id="as">Add social link</button></div><label for="mq">Map location (address or coordinates, optional)</label><input type="text" id="mq" maxlength="300"><label class="ck"><input type="checkbox" id="fo"> Show the message form on the website</label><p class="hint">Messages are saved privately in your GitHub data repo, which must be Private. Use Check setup to confirm.</p><div class="row"><button class="btn" type="submit">Save changes</button></div><p class="msg" id="mg"></p></form>`;
  $('#ci').value = c.intro || ''; $('#ab').value = c.about || ''; $('#mq').value = c.mapQuery || ''; $('#fo').checked = c.formOn === true;
  const addRow = (l, v) => {
    const r = document.createElement('div'); r.className = 'cr';
    r.innerHTML = '<input type="text" placeholder="Label" class="l"><input type="text" placeholder="Value" class="v"><button type="button" class="btn alt">Remove</button>';

    r.querySelector('button').onclick = () => r.remove();
    $('#ri').appendChild(r);
  };
  const addSoc = (t, u) => {
    const r = document.createElement('div'); r.className = 'cr';
    r.innerHTML = `<select class="st">${opts}</select><input type="text" class="su" placeholder="Link, username or number"><button type="button" class="btn alt">Remove</button>`;
    r.querySelector('.st').value = t || 'facebook'; r.querySelector('.su').value = u || '';
    r.querySelector('button').onclick = () => r.remove();
    $('#si').appendChild(r);
  };
  (c.items || []).forEach(i => addRow(i.label, i.value));
  (c.social || []).forEach(s => addSoc(s.type, s.url));
  $('#ad').onclick = () => addRow('', '');
  $('#as').onclick = () => addSoc('', '');
  $('#cf').onsubmit = async ev => {
    ev.preventDefault();
    const mg = $('#mg'); mg.textContent = 'Saving…';
    const items = [...document.querySelectorAll('#ri .cr')].map(r => ({label:r.querySelector('.l').value, value:r.querySelector('.v').value}));
    const social = [...document.querySelectorAll('#si .cr')].map(r => ({type:r.querySelector('.st').value, url:r.querySelector('.su').value}));
    try { await api('/api/contact', {method:'POST', body:JSON.stringify({intro:$('#ci').value, about:$('#ab').value, items, social, mapQuery:$('#mq').value, formOn:$('#fo').checked})}); mg.textContent = 'Saved.'; loadFooter(); }
    catch (e) { devFail(e, mg); }
  };
}
async function devMessages() {
  view.innerHTML = '<h2>Messages</h2><div id="ml"><p class="note">Loading…</p></div>';
  const draw = async () => {
    let list;
    try { list = await api('/api/messages'); } catch (e) { $('#ml').innerHTML = '<p class="msg" id="mg"></p>'; return devFail(e, $('#mg')); }
    if (!list.length) { $('#ml').innerHTML = '<p>No messages yet.</p>'; return; }
    $('#ml').innerHTML = list.map(m => `<div class="dm"><div class="meta">${m.read ? '' : '<span class="tag">New</span>'}<span class="dt">${fmt(m.date)}</span></div><b>${esc(m.name)}</b><div class="pre">${esc(m.message)}</div>${m.email ? `<div>${linkValue(m.email)}</div>` : ''}${m.phone ? `<div>${linkValue(m.phone)}</div>` : ''}<div class="row"><button class="btn alt" data-r="${esc(m.id)}" data-v="${m.read ? 0 : 1}">${m.read ? 'Mark unread' : 'Mark read'}</button><button class="btn alt" data-d="${esc(m.id)}">Delete</button></div></div>`).join('');
    $('#ml').querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {

    });
    $('#ml').querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
      if (!confirm('Delete this message permanently?')) return;

  draw();
}
async function devSetup() {
  view.innerHTML = '<h2>Check setup</h2><div id="ck"><p class="note">Checking…</p></div>';
  try {
    const r = await api('/api/health');
    $('#ck').innerHTML = r.checks.map(c => `<div class="dp"><b>${c.ok ? '✓' : '✗'} ${esc(c.name)}</b><span>${esc(c.message)}</span></div>`).join('');
  } catch (e) { $('#ck').innerHTML = '<p class="msg" id="mg"></p>'; devFail(e, $('#mg')); }

/* ---------- router ---------- */
function route() {
  const seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (seg[0] === 'developer') return localStorage.getItem(KEY) ? showDash('article') : showLogin();
  const s = seg[0];
  if (s === 'opinion' || s === 'article') { setNav(s); return seg[1] ? showPost(s, seg[1]) : showList(s); }
  if (s === 'contact') { setNav('contact'); return showContact(); }
  setNav('home'); showList('home');
}
window.addEventListener('hashchange', route);
renderFooter({});
loadFooter();
route();
</script>
