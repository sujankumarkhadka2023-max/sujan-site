<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Login</title><link rel="stylesheet" href="./assets/styles.css"></head>
<body>
<main class="auth-page">
<form id="loginForm" class="panel">
<h1>Developer Login</h1>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Login</button>
<p id="message" class="error"></p>
</form>
</main>
<script src="./config.js"></script><script src="./components/auth.js"></script>
</body>
</html>
