</style></head><body>
<div id="intro" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><text x="50" y="62" text-anchor="middle" font-size="34" font-weight="700" font-family="Georgia,serif">SK</text></svg><b>The Sujan Khadka</b></div>
<div id="app"></div>
<script>
const MULTI=['History','Culture & Lifestyle'];const CATS=['World','Opinion','History','Culture & Lifestyle'],SL={World:'world',Opinion:'opinion',History:'history','Culture & Lifestyle':'culture'};
const SUBS={'World':['News','Analysis','Explainer'],'Culture & Lifestyle':['Culture','Lifestyle']};
const PG={about:'About Me',contact:'Contact',support:'Support us',privacy:'Privacy',cookies:'Cookies',terms:'Terms'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={articles:[],home:[],pages:{},views:{},audios:[]},ready=false,A=null,adm=null,ed=null,tab='articles',limit={};
const fd=d=>new Date(d).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const rt=b=>Math.max(1,Math.round((b||'').split(/\s+/).length/220));
const live=()=>D.articles.filter(a=>a.status==='published'&&new Date(a.date)<=new Date()).sort((a,b)=>new Date(b.date)-new Date(a.date));
const url=a=>'/'+SL[a.category]+'/'+a.slug,safeImg=s=>s&&s.startsWith('/img/')?esc(s):'';
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'story';
const api=(p,o={})=>fetch(p,o);

/* ---------- public ---------- */
function card(a){const im=safeImg(a.thumb||a.image);return `<div class="card">${im?`<a href="${url(a)}"><img class="ph" loading="lazy" src="${im}" alt="${esc(a.imageCaption||a.title)}"></a>`:''}<div class="cat">${esc(a.subcategory||a.category)}</div><h3><a href="${url(a)}">${esc(a.title)}</a></h3>${a.subtitle?`<p>${esc(a.subtitle)}</p>`:''}<div class="meta">${esc(a.author)} · ${fd(a.date)}</div><a class="sm" href="${url(a)}">Read more <span class="ar">→</span></a></div>`}
function block(t,list,key){if(!list.length)return `<div class="sec"><h2>${t}</h2><div class="empty">No stories published yet.</div></div>`;const n=limit[key+t]||4;
 return `<div class="sec"><h2><a href="/${key}">${t}</a></h2><div class="g">${list.slice(0,n).map(card).join('')}</div>${list.length>n?`<button class="more" onclick="limit['${key+t}']=${n}+4;go()">See more</button>`:''}</div>`}
function shell(inner,cur){
 const items=[['Home','/'],...CATS.map(c=>[c,'/'+SL[c]]),['Audio','/audio'],['Videos','/videos'],['Horoscope','/horoscope'],['Games','/games.html']];
 return `<div class="util" id="top"><div class="w"><span>${new Date().toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}<button class="wxb" id="wx" onclick="wxExact()" title="Tap to use your exact location">${wxHtml()}</button></span><span><a href="/p/support">Support</a><button class="thb" id="thm" aria-label="Toggle dark mode" onclick="toggleTheme()"></button></span></div></div>
 <a class="hd" href="/" aria-label="The Sujan Khadka — home"><img src="/header.webp" width="1600" height="262" fetchpriority="high" alt="The Sujan Khadka"></a>
 <div class="nb"><div class="w"><nav aria-label="Sections">${items.map(([t,h])=>`<a href="${h}" class="${cur===h?'on':''}">${t}</a>`).join('')}</nav><button id="mb" aria-label="Menu" aria-expanded="false" aria-controls="mp" onclick="const m=$('#mp');m.classList.toggle('open');this.setAttribute('aria-expanded',m.classList.contains('open'))"><i></i><i></i><i></i></button>
 <div id="mp"><h4>Sections</h4>${items.map(([t,h])=>`<a href="${h}">${t}</a>`).join('')}<a class="fy" href="/p/about">About</a><a class="fy" href="/p/contact">Contact</a><a class="fy" href="/p/support">Support us</a></div></div></div>
 <div class="w">${ticker()}<main id="main">${inner}</main></div>
 <footer><div class="w"><div class="g"><div><h4>Sections</h4>${CATS.map(c=>`<a href="/${SL[c]}">${c}</a>`).join('')}</div><div><a class="fy" href="/p/about">About</a><a class="fy" href="/p/contact">Contact</a><a class="fy" href="/p/support">Support us</a></div></div><div class="ins" id="ins"><div><h4>Install as an app</h4><span>Add the site to your home screen. Recent stories open even with weak internet.</span><span id="inh" style="display:none"></span></div><button class="bt" id="inb" onclick="installApp()">Install</button></div><div class="meta fb"><span>© ${new Date().getFullYear()} The Sujan Khadka. All rights reserved.</span><a href="#top" onclick="event.preventDefault();document.getElementById('top').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})">Back to top ↑</a></div></div></footer>`}
function home(){const L=live();if(!L.length)return `<div class="empty" style="padding:60px 0;text-align:center">No stories have been published yet.</div>`;
 let f=D.home.map(id=>L.find(a=>a.id===id)).filter(Boolean);if(!f.length)f=L.slice(0,5);
 const [lead,...rest]=f,sec=rest.slice(0,4),im=safeImg(lead.image);
 let h=`<section class="lead"><div><div class="cat">${esc(lead.category)}</div><h1><a href="${url(lead)}">${esc(lead.title)}</a></h1><p>${esc(lead.subtitle)}</p><div class="meta">${esc(lead.author)} · ${fd(lead.date)}</div><a class="sm" href="${url(lead)}">Read more <span class="ar">→</span></a></div>${im?`<a href="${url(lead)}"><img class="ph" fetchpriority="high" decoding="async" src="${im}" alt="${esc(lead.imageCaption||lead.title)}"></a>`:''}</section>`;
 h+=bnHtml();
 if(sec.length)h+=`<div class="sec"><div class="g">${sec.map(card).join('')}</div></div>`;
 CATS.forEach(c=>h+=block(c,L.filter(a=>a.category===c),SL[c]));return h}
function stats(L){let v=0;for(const k in (D.views||{}))v+=+D.views[k]||0;let g=0;try{g=+localStorage.getItem('sk_games_played')||0}catch(e){}
 const c=(n,l)=>`<div class="st"><b data-n="${n}">${n.toLocaleString()}</b><span>${l}</span></div>`;
 return `<div class="stats">${c(L.length,'Stories published')}${c(v,'Total reads')}${c(g,'Games played')}</div>`}
function section(c){const L=live().filter(a=>a.category===c),k=SL[c];let h=`<h1 style="margin:24px 0 0">${c}</h1>`;
 if(!L.length)return h+`<div class="empty">No stories published yet.</div>`;
 const fe=D.home.map(id=>L.find(a=>a.id===id)).filter(Boolean)[0]||L[0],im=safeImg(fe.image),rest=L.filter(a=>a!==fe);
 h+=`<section class="lead"><div><h1 style="font-size:34px"><a href="${url(fe)}">${esc(fe.title)}</a></h1><p>${esc(fe.subtitle)}</p><div class="meta">${esc(fe.author)} · ${fd(fe.date)}</div><a class="sm" href="${url(fe)}">Read more <span class="ar">→</span></a></div>${im?`<img class="ph" src="${im}" alt="${esc(fe.imageCaption||fe.title)}">`:''}</section>`;
 if(c==='World'){const mr=[...L].sort((a,b)=>(D.views[b.id]||0)-(D.views[a.id]||0)).slice(0,5);
  h+=block('Latest World News',rest.filter(a=>a.subcategory==='News'||!a.subcategory),k)+block('Analysis',L.filter(a=>a.subcategory==='Analysis'),k)+block('Explainers',L.filter(a=>a.subcategory==='Explainer'),k)+`<div class="sec"><h2>More from World</h2><ol>${mr.map(a=>`<li><a href="${url(a)}">${esc(a.title)}</a></li>`).join('')}</ol></div>`}

const DEF={about:'Hello, I\'m Sujan Kumar Khadka.\n\nI\'m a student and lifelong learner committed to personal growth, continuous learning, and professional development. I enjoy exploring new ideas, developing my skills, and discovering opportunities to grow both personally and professionally.\n\nThis website is my personal space on the internet, where I share news, opinion, and culture and lifestyle.\n\nI believe that consistency, curiosity, and a willingness to learn are essential for long-term success.\n\nMy goal is simple: to keep learning, keep improving, and create something meaningful along the way.\n\nThank you for visiting my website.\n\nLearning today. Building for tomorrow.',contact:'We would be glad to hear from you. Whether you have a question, a news tip, feedback or a correction, please write to us by email.\n\nEmail: sujankumarkhadka56@gmail.com\n\nWHAT YOU CAN WRITE TO US ABOUT\nNews tips and story ideas\nCorrections and feedback on our stories\nQuestions about the website\nPrivacy enquiries\n\nWHEN YOU WRITE\nPlease include a clear subject line and, if you are writing about a story, the link or headline. We read every message and reply as soon as we can.\n\nWe use your email address and message only to reply to you.',support:'The Sujan Khadka is independent, free to read and free of advertising. Your support helps us keep it that way. There are simple ways to help, and every one of them matters.\n\nREAD AND SHARE\nShare stories you value with friends, family and on social media. Word of mouth is the strongest support an independent site can have.\n\nTELL US WHAT YOU THINK\nHonest feedback makes our stories better. Tell us what you liked, what we missed and what you would like to read next.\n\nSEND A TIP OR A CORRECTION\nIf you know about a story we should cover, or you spot a mistake, please write to us. Our Contact page has the details.\n\nINSTALL THE APP\nAdd the site to your home screen from the footer of any page. Recent stories open even with a weak internet connection.\n\nThank you for reading and for being part of The Sujan Khadka.',privacy:"The Sujan Khadka respects your privacy. This page explains what information is handled when you use this website.\n\nWHAT WE COLLECT\nReaders do not need an account, and the site does not ask for your name, email or other personal details. If you email us, we use your email address and message only to reply.\n\nTECHNICAL DATA\nOur hosting provider, Cloudflare, processes technical data such as IP address and browser type to deliver the site and keep it secure. We do not use this data to identify individual readers.\n\nADVERTISING AND TRACKING\nThis site does not run advertising or third-party tracking scripts.\n\nEXTERNAL LINKS\nStories may link to other websites. We are not responsible for their privacy practices.\n\nQUESTIONS\nFor privacy questions, contact: sujankumarkhadka56@gmail.com\n\nWe may update this page from time to time. The latest version is always published here.",cookies:"This website does not use cookies to track readers.\n\nLOCAL STORAGE\nTo load faster, your browser may keep a copy of recently published stories on your device. This contains only public stories and no personal information. You can clear it at any time in your browser settings.\n\nSIGN-IN COOKIE\nA secure sign-in cookie is used only by the site developer to manage content. Readers never receive it.\n\nOTHER WEBSITES\nSites we link to may use their own cookies, which we do not control.\n\nQUESTIONS\nContact: sujankumarkhadka56@gmail.com",terms:"By using The Sujan Khadka you agree to these terms.\n\nCONTENT\nStories, text and images published here belong to The Sujan Khadka unless stated otherwise. You may share links and quote short extracts with credit and a link back. Please do not republish full stories or images without written permission.\n\nOPINION AND ACCURACY\nWe aim to be accurate and fair. Opinion pieces reflect the views of their authors. Content is for general information and is not professional advice. If you find an error, please email us.\n\nUSE OF THE SITE\nPlease do not misuse the site, try to disrupt it, or try to reach areas that are not public.\n\nLINKS\nWe may link to other websites and are not responsible for their content.\n\nCHANGES\nWe may update these terms or the site at any time.\n\nCONTACT\nsujankumarkhadka56@gmail.com"};

/* ---------- developer portal (/admin) ---------- */
function loginView(){return `<div class="ad" style="max-width:380px"><h1>Editor sign in</h1><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="bt" onclick="doLogin()">Sign in</button><p class="meta" id="le"></p></div>`}
async function doLogin(){const r=await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
 if(r.ok){adm=null;go()}else $('#le').textContent=(await r.json().catch(()=>({}))).error||'Sign in failed'}
async function persist(){const body=JSON.stringify(A);if(body.length>SITE_LIMIT){alert('Not saved: the site is too full ('+body.length.toLocaleString()+' characters; the limit is '+SITE_LIMIT.toLocaleString()+' for all articles, pages and audio together). Shorten or remove some text, then save again.');return false}
 const r=await api('/api/admin/db',{method:'PUT',headers:{'content-type':'application/json'},body});if(!r.ok){if(r.status===413){alert('Not saved: this is too large for the server.');return false}alert('Save failed ('+r.status+'). Sign in again.');adm=null;go();return false}return true}
function adminView(){const T=(k,t)=>`<button class="bt ${tab===k?'':'o'}" onclick="tab='${k}';ed=null;go()">${t}</button>`;
 let h=`<div class="ad"><h1>Newsroom</h1><div class="tabs">${T('articles','Articles')}${T('home','Homepage')}${T('pages','Pages')}${T('audio','Audio')}${T('videos','Videos')}${T('horo','Horoscope')}${T('ad','Advertising')}<button class="bt o" onclick="logout()">Sign out</button></div>`;
 h+=stats(A.articles.filter(a=>a.status==='published'));
 if(tab==='articles')h+=ed?editor():list();
 if(tab==='home')h+=`<p class="meta">Featured stories in order: first is the lead, next four are secondary.</p>`+(A.home.length?A.home.map((id,i)=>{const a=A.articles.find(x=>x.id===id);return a?`<div class="row"><span>${i+1}. ${esc(a.title)}</span><span><button class="bt o" onclick="mv(${i},-1)">↑</button><button class="bt o" onclick="mv(${i},1)">↓</button><button class="bt o" onclick="feat('${id}')">Remove</button></span></div>`:''}).join(''):'<div class="empty">Nothing featured. Latest stories are used.</div>');
 if(tab==='videos')h+=videosTab();
 if(tab==='horo')h+=hzTab();
 if(tab==='ad')h+=adTab();
 if(tab==='audio')h+=audioTab();
 if(tab==='pages')h+=Object.keys(PG).map(k=>`<label>${PG[k]}</label><textarea style="min-height:110px" id="pg_${k}">${esc(A.pages[k]||DEF[k]||'')}</textarea>`).join('')+`<button class="bt" onclick="savePages()">Save pages</button>`;
 return h+'</div>'}
async function savePages(){Object.keys(PG).forEach(k=>A.pages[k]=$('#pg_'+k).value);if(await persist())alert('Saved')}
async function logout(){await api('/api/logout',{method:'POST'});adm='out';A=null;history.pushState(null,'','/');go()}
function list(){return `<button class="bt" onclick="ed={};go()">New article</button>`+(A.articles.length?[...A.articles].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(a=>{const sc=a.status==='published'&&new Date(a.date)>new Date();return `<div class="row"><span><strong>${esc(a.title)}</strong><br><span class="meta">${esc(a.category)} · ${sc?'Scheduled':a.status} · ${fd(a.date)}${a.featured?' · Featured':''}</span></span><span><button class="bt o" onclick="ed=A.articles.find(x=>x.id==='${a.id}');go()">Edit</button><button class="bt o" onclick="pub('${a.id}')">${a.status==='published'?'Unpublish':'Publish'}</button><button class="bt o" onclick="feat('${a.id}')">${a.featured?'Unfeature':'Feature'}</button><button class="bt d" onclick="del('${a.id}')">Delete</button></span></div>`}).join(''):'<div class="empty">No articles yet.</div>')}
function editor(){const a=ed,c=a.category||'World',multi=MULTI.includes(c),max=multi?5:1,imgs=a.images||(a.images=a.image?[{url:a.image,caption:a.imageCaption||''}]:[]),o=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 const dt=a.date?new Date(new Date(a.date)-new Date(a.date).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 return `<label>Headline</label><input id="e_t" value="${esc(a.title)}"><label>Subheadline (optional)</label><input id="e_s" value="${esc(a.subtitle)}">
 <label>Category</label><select id="e_c" onchange="sync();ed.category=this.value;ed.subcategory='';if(!MULTI.includes(this.value))ed.images=(ed.images||[]).slice(0,1);go()">${o(CATS,c)}</select>
 ${SUBS[c]?`<label>Subcategory</label><select id="e_sc">${o(SUBS[c],a.subcategory)}</select>`:''}
 <label>Author</label><input id="e_a" value="${esc(a.author)}"><label>Tags (comma separated)</label><input id="e_g" value="${esc((a.tags||[]).join(', '))}">

 const it=L.map(a=>`<a href="${url(a)}">${esc(a.title)}</a>`).join('<i class="tks">◆</i>')+'<i class="tks">◆</i>',dur=Math.max(30,Math.round(L.reduce((n,a)=>n+a.title.length,0)*.3));
 return `<div class="tk" role="region" aria-label="Latest stories"><span class="tkl"><i></i>Latest</span><div class="tkw"><div class="tkt" style="--d:${dur}s"><span>${it}</span><span aria-hidden="true">${it.replace(/<a /g,'<a tabindex="-1" ')}</span></div></div></div>`}
function skeleton(){const b=(h,w,m)=>`<div class="skl" style="height:${h}px;width:${w};margin:${m}"></div>`;
 return `<div aria-busy="true" aria-label="Loading stories">${b(30,'55%','22px 0 12px')}${b(16,'92%','0 0 8px')}${b(16,'70%','0 0 26px')}<div class="g">${[1,2,3,4].map(()=>`<div>${b(150,'100%','0 0 10px')}${b(16,'90%','0 0 8px')}${b(13,'55%','0')}</div>`).join('')}</div></div>`}
function imgFx(){if(RM)return;document.querySelectorAll('main img').forEach(im=>{if(im.complete||im.classList.contains('lz'))return;im.classList.add('lz');const ok=()=>im.classList.add('ok');im.addEventListener('load',ok,{once:true});im.addEventListener('error',ok,{once:true})})}
/* card tilt (mouse devices only) */
if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&matchMedia('(hover:hover) and (pointer:fine)').matches){let raf=0;
 document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c||raf)return;raf=requestAnimationFrame(()=>{raf=0;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--ry',(x*7).toFixed(2)+'deg');c.style.setProperty('--rx',(-y*6).toFixed(2)+'deg')})},{passive:true});
 document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}},{passive:true})}

/* ---------- Videos section (stored in pages.__videos, so links work without any server change) ---------- */
const vids=()=>(((D.pages||{}).__videos||{}).items||[]);
const vidPub=v=>v.status==='published'&&new Date(v.date)<=new Date();
function vidPlayer(v){const u=String(v.url||'');
 if(/^\/video\/[a-f0-9-]{36}\.(mp4|webm)$/.test(u))return `<figure class="vid mp"><video controls preload="metadata" playsinline src="${esc(u)}#t=0.1"></video></figure>`;
 return mediaBlock(u)||''}
function vidCard(v){const pl=vidPlayer(v);if(!pl)return'';return `<div class="vcd">${pl}<h3>${esc(v.title)}</h3>${v.desc?`<p class="ad1">${esc(v.desc)}</p>`:''}<div class="meta">${v.dur?fmt(v.dur)+' · ':''}${fd(v.date)}</div></div>`}
function videoPg(){const L=vids().filter(vidPub).sort((a,b)=>new Date(b.date)-new Date(a.date)),cards=L.map(vidCard).filter(Boolean);
 document.title='Videos — The Sujan Khadka';
 return `<div class="pg vds"><h1>Videos</h1><p>Watch our latest videos. Tap a video to play it right here.</p>${cards.length?`<div class="vgrid">${cards.join('')}</div>`:'<p><span class="empty">No videos have been published yet.</span></p>'}</div>`}
/* portal */
function videosTab(){const L=[...vids()].sort((a,b)=>new Date(b.date)-new Date(a.date));
 return `<div class="aup"><strong>Add a video by link (recommended)</strong><p class="meta">Upload the video to YouTube or Vimeo, then paste its link here. Any length works. A direct https link to an MP4 file also works.</p><label>Title</label><input id="vd_t" placeholder="Video title"><label>Description (optional)</label><textarea id="vd_d" style="min-height:70px"></textarea><label>Link</label><input id="vd_u" type="url" inputmode="url" placeholder="https://…"><button class="bt" onclick="vdAddLink()">Add video</button></div>`+
 `<details class="aup"><summary>Or upload a short clip (up to 10 MB, about 30–60 seconds)</summary><p class="meta">Export it as MP4 at 720p to keep it small. Longer videos should go on YouTube.</p><label>Title</label><input id="vf_t" placeholder="Video title"><label>Description (optional)</label><textarea id="vf_d" style="min-height:70px"></textarea><label>Video file — from your phone or computer</label><input type="file" id="vf_f" accept="video/mp4,video/webm,video/*"><div class="apb"><i id="vf_p"></i></div><button class="bt" id="vf_b" onclick="vdUpload()">Upload video</button></details>`+
 (L.length?L.map(v=>{const loc=/^\/video\//.test(v.url||''),ok=!!vidPlayer(v);return `<div class="row"><span><strong>${esc(v.title)}</strong><br><span class="meta">${v.status} · ${loc?'Uploaded clip':ok?'Link':'Invalid link'}${v.dur?' · '+fmt(v.dur):''}${v.size?' · '+(v.size/1048576).toFixed(1)+' MB':''} · ${fd(v.date)}</span><br><a class="meta" href="${esc(v.url||'#')}" target="_blank" rel="noopener">Open video</a></span><span><button class="bt o" onclick="vdPub('${esc(v.id)}')">${v.status==='published'?'Unpublish':'Publish'}</button><button class="bt d" onclick="vdDel('${esc(v.id)}')">Delete</button></span></div>`}).join(''):'<div class="empty">No videos added yet.</div>')}
async function vdSave(mut){A.pages=A.pages||{};const o=A.pages.__videos||{items:[]};o.items=o.items||[];mut(o.items);A.pages.__videos=o;return persist()}
async function vdAddLink(){const t=$('#vd_t').value.trim(),u=$('#vd_u').value.trim();
 if(!t)return alert('Please enter a title.');if(!u)return alert('Please paste a link.');
 if(!/^https:\/\//i.test(u)||!mediaBlock(u))return alert('This link is not supported. Use a YouTube or Vimeo link, or a direct https link to an MP4 / WebM file.');
 if(await vdSave(it=>it.push({id:'v'+Date.now(),title:t,desc:$('#vd_d').value.trim(),url:u,date:new Date().toISOString(),status:'published'})))go()}
const vidDur=f=>new Promise(ok=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';v.onloadedmetadata=()=>{ok(isFinite(v.duration)?Math.round(v.duration):0);URL.revokeObjectURL(u)};v.onerror=()=>{ok(0);URL.revokeObjectURL(u)};v.src=u});
async function vdUpload(){const t=$('#vf_t').value.trim(),f=$('#vf_f').files[0];
 if(!t)return alert('Please enter a title.');if(!f)return alert('Please choose a video file.');
 if(f.type&&!f.type.startsWith('video/'))return alert('Please choose a video file.');
 if(f.size>10e6)return alert('This clip is '+(f.size/1e6).toFixed(1)+' MB. The limit is 10 MB (about 30–60 seconds at 720p). Please shorten or compress it, or put the video on YouTube and add it by link.');
 const b=$('#vf_b'),bar=$('#vf_p'),desc=$('#vf_d').value.trim();b.disabled=true;b.textContent='Uploading…';
 try{const url=await putAudio(f,n=>{bar.style.width=n+'%';b.textContent='Uploading… '+n+'%'},'video/mp4'),dur=await vidDur(f);
  if(await vdSave(it=>it.push({id:'v'+Date.now(),title:t,desc,url,dur,size:f.size,date:new Date().toISOString(),status:'published'})))go()}
 catch(e){alert('Video upload failed: '+(e||'unknown error')+'. If it says the server answered 400 or 415, the new worker.js has not been uploaded yet.');b.disabled=false;b.textContent='Upload video'}}
async function vdPub(id){await vdSave(it=>{const v=it.find(x=>x.id===id);if(v)v.status=v.status==='published'?'draft':'published'});go()}
async function vdDel(id){if(!confirm('Delete this video from the website?'))return;await vdSave(it=>{const i=it.findIndex(x=>x.id===id);if(i>=0)it.splice(i,1)});go()}

async function auAddLink(){const t=$('#al_t').value.trim(),u=$('#al_u').value.trim();
 if(!t)return alert('Please enter a title.');if(!u)return alert('Please paste a link.');

 A.audios=A.audios||[];A.audios.push({id:'u'+Date.now(),title:t,desc:$('#al_d').value.trim(),url:u,date:new Date().toISOString(),status:'published'});
 if(await persist())go()}
function putAudio(f,pg,dflt){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api/admin/upload');x.setRequestHeader('content-type',f.type||dflt||'audio/mpeg');

function words(el){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(tw.nextNode())ns.push(tw.currentNode);let i=0;
 ns.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}

function countUp(el){const to=+el.dataset.n,t0=performance.now(),d=1500;(function f(t){const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}
