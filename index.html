</style></head><body>
<div id="intro" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><text x="50" y="62" text-anchor="middle" font-size="34" font-weight="700" font-family="Georgia,serif">SK</text></svg><b>The Sujan Khadka</b></div>
<div id="app"></div>
<script>
const MULTI=['History','Culture & Lifestyle'];const CATS=['World','Opinion','History','Culture & Lifestyle'],SL={World:'world',Opinion:'opinion',History:'history','Culture & Lifestyle':'culture'};
const SUBS={'World':['News','Analysis','Explainer'],'Culture & Lifestyle':['Culture','Lifestyle']};
const PG={about:'About Me',contact:'Contact',support:'Support us',privacy:'Privacy',cookies:'Cookies',terms:'Terms'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={articles:[],home:[],pages:{},views:{},audios:[]},ready=false,A=null,adm=null,ed=null,tab='articles',limit={};
const fd=d=>new Date(d).toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const rt=b=>Math.max(1,Math.round((b||'').split(/\s+/).length/220));
const live=()=>D.articles.filter(a=>a.status==='published'&&new Date(a.date)<=new Date()).sort((a,b)=>new Date(b.date)-new Date(a.date));
const url=a=>'/'+SL[a.category]+'/'+a.slug,safeImg=s=>s&&s.startsWith('/img/')?esc(s):'';
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'story';
const api=(p,o={})=>fetch(p,o);

/* ---------- public ---------- */
/* ---------- live rates card: NRB currency + FENEGOSIDA gold & silver, from /api/rates ---------- */
function ratesHtml(){return `<section class="rtc" id="rtc" aria-label="Today's rates" hidden></section>`}
function ratesInit(){const el=document.getElementById('rtc');if(!el)return;
 const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}),dm=d=>{const t=new Date(d+'T00:00:00');return isNaN(t)?'':t.toLocaleDateString('en-GB',{day:'numeric',month:'short'})},
 tile=(a,b,c,k)=>`<div class="rtt${k?' '+k:''}"><span>${a}</span><b>${b}</b><small>${c}</small></div>`,
 show=d=>{if(!el.isConnected||!d)return;const m=d.metals,cu=d.cur;let g='',c='';
  if(m){if(m.fine)g+=tile('Fine gold · छापावाल सुन','Rs '+nf.format(m.fine),'per tola','au');if(m.tejabi)g+=tile('Tejabi gold · तेजाबी','Rs '+nf.format(m.tejabi),'per tola','au');if(m.silver)g+=tile('Silver · चाँदी','Rs '+nf.format(m.silver),'per tola','ag')}
  if(cu&&cu.list&&cu.list.length){const t=x=>tile(esc(x.c)+(x.u>1?' · '+x.u:''),nf.format(x.b),'Sell '+nf.format(x.s));
   c=`<div class="rtg">${cu.list.slice(0,4).map(t).join('')}</div>`+(cu.list.length>4?`<details class="rtm"><summary>More currencies</summary><div class="rtg">${cu.list.slice(4).map(t).join('')}</div></details>`:'')}
  if(!g&&!c)return;
  const st=(d.curStale||d.metalsStale)?' · last known values':'';
  el.innerHTML=`<div class="rth"><h2>Today's rates · आजको भाउ</h2><small>${cu?'Buy rates, '+dm(cu.date):''}</small></div>${g?`<div class="rtg">${g}</div>`:''}${c}<p class="rts">Nepal Rastra Bank · FENEGOSIDA${st}</p>`;el.hidden=false};
 try{const c=JSON.parse(sessionStorage.getItem('sk_rt')||'null');if(c&&Date.now()-c.t<6e5){show(c.d);return}}catch(e){}
 fetch('/api/rates').then(r=>r.ok?r.json():Promise.reject()).then(d=>{try{sessionStorage.setItem('sk_rt',JSON.stringify({t:Date.now(),d}))}catch(e){}show(d)}).catch(()=>{})}

/* ---------- generated cover art: a unique abstract picture per title, used when a story has no photo ---------- */
let _art=0;
const ART_HUE={World:215,Opinion:338,History:28,'Culture & Lifestyle':168};
function artHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function artRng(seed){let a=seed||1;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function art(a,sty){
 const title=String(a&&a.title||a&&a.id||'Story'),r=artRng(artHash(title.trim().toLowerCase())),n=++_art,
  hs=(h,s,l,o)=>`hsla(${Math.round(((h%360)+360)%360)},${s}%,${l}%,${o==null?1:o})`,f=v=>v.toFixed(1),
  h0=(ART_HUE[a&&a.category]!=null?ART_HUE[a.category]:200+r()*140)+(r()*56-28),h1=h0+(r()<.5?-1:1)*(28+r()*36),
  bg1=hs(h0,60,14),bg2=hs(h1,62,32),lt=hs(h1,70,78),ac=hs(h0+160+r()*40,78,64),gold=r()<.4?'#ffe500':hs(h1+20,85,70),style=Math.floor(r()*4),
  id='ar'+n;
 let d=`<defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient><linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></linearGradient><radialGradient id="${id}s"><stop offset="0" stop-color="${gold}" stop-opacity=".95"/><stop offset=".45" stop-color="${gold}" stop-opacity=".25"/><stop offset="1" stop-color="${gold}" stop-opacity="0"/></radialGradient><filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter></defs><rect width="600" height="400" fill="url(#${id}g)"/>`;
 if(style===0){
  const sx=90+r()*420,sy=70+r()*80,sr=30+r()*34;d+=`<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr*3)}" fill="url(#${id}s)"/><circle cx="${f(sx)}" cy="${f(sy)}" r="${f(sr)}" fill="${gold}" opacity=".92"/>`;
  for(let i=0;i<5;i++){const y0=165+i*48,a1=14+r()*26,k1=.006+r()*.008,p1=r()*6.28,a2=6+r()*14,k2=.015+r()*.012,p2=r()*6.28;let p=`M0 400L0 ${f(y0)}`;
   for(let x=0;x<=600;x+=15)p+=`L${x} ${f(y0+a1*Math.sin(x*k1*6.28+p1)+a2*Math.sin(x*k2*6.28+p2))}`;
   d+=`<path d="${p}L600 400Z" fill="${i%2?lt:ac}" opacity="${f(.16+i*.1)}"/>`}
 }else if(style===1){
  const cx=120+r()*360,cy=90+r()*220;d+=`<circle cx="${f(cx+90)}" cy="${f(cy-70)}" r="${f(120+r()*90)}" fill="${hs(h1,70,60,.28)}"/>`;
  for(let i=1;i<=8;i++){const rr=i*38+r()*10;d+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rr)}" fill="none" stroke="${lt}" stroke-opacity="${f(.34-i*.03)}" stroke-width="${i%3?1.2:2}"${i%2?` stroke-dasharray="${2+Math.floor(r()*8)} ${5+Math.floor(r()*12)}"`:''}/>`}
  for(let i=0;i<4;i++){const rr=(2+Math.floor(r()*6))*38,an=r()*6.28,pr=6+r()*14;d+=`<circle cx="${f(cx+rr*Math.cos(an))}" cy="${f(cy+rr*Math.sin(an))}" r="${f(pr)}" fill="${i?ac:gold}" opacity=".95"/>`}
  d+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(16+r()*12)}" fill="${gold}"/>`;
 }else if(style===2){
  const cols=8,rows=6,w=600/cols,h=400/rows,pts=[];
  for(let j=0;j<=rows;j++){pts[j]=[];for(let i=0;i<=cols;i++)pts[j][i]=[i*w+((i>0&&i<cols)?(r()-.5)*w*.7:0),j*h+((j>0&&j<rows)?(r()-.5)*h*.7:0)]}
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const A=pts[j][i],B=pts[j][i+1],C=pts[j+1][i+1],D=pts[j+1][i],t=(i/cols+j/rows)/2;
   [[A,B,C],[A,C,D]].forEach(tr=>{d+=`<polygon points="${tr.map(q=>f(q[0])+','+f(q[1])).join(' ')}" fill="${hs(h0+(h1-h0)*t+(r()-.5)*12,58+r()*14,16+t*34+(r()-.5)*14)}"/>`})}
  const gx=r()*600,gy=r()*400;d+=`<circle cx="${f(gx)}" cy="${f(gy)}" r="${f(70+r()*50)}" fill="url(#${id}s)"/>`;
 }else{
  for(let i=0;i<5;i++){const c=[ac,lt,gold,hs(h0,75,55),hs(h1,80,60)][i];d+=`<ellipse cx="${f(r()*600)}" cy="${f(r()*400)}" rx="${f(90+r()*130)}" ry="${f(50+r()*90)}" fill="${c}" opacity="${f(.32+r()*.3)}" filter="url(#${id}b)" transform="rotate(${f(r()*80-40)} 300 200)"/>`}
  for(let i=0;i<3;i++){const y=70+i*110+r()*30;d+=`<path d="M0 ${f(y)}C150 ${f(y-60+r()*120)} 330 ${f(y-60+r()*120)} 600 ${f(y+r()*40-20)}" fill="none" stroke="${lt}" stroke-opacity="${f(.2+r()*.2)}" stroke-width="${f(1+r()*2)}"/>`}
 }
 for(let i=0;i<34;i++)d+=`<circle cx="${f(r()*600)}" cy="${f(r()*400)}" r="${f(.6+r()*1.5)}" fill="#fff" opacity="${f(.15+r()*.4)}"/>`;
 return `<svg class="ph art" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"${sty?` style="${sty}"`:''}>${d}<rect width="600" height="400" fill="url(#${id}v)"/></svg>`}

function card(a){const im=safeImg(a.thumb||a.image);return `<div class="card">${im?`<a href="${url(a)}"><img class="ph" loading="lazy" src="${im}" alt="${esc(a.imageCaption||a.title)}"></a>`:`<a href="${url(a)}" tabindex="-1" aria-hidden="true">${art(a)}</a>`}<div class="cat">${esc(a.subcategory||a.category)}</div><h3><a href="${url(a)}">${esc(a.title)}</a></h3>${a.subtitle?`<p>${esc(a.subtitle)}</p>`:''}<div class="meta">${esc(a.author)} · ${fd(a.date)}</div><a class="sm" href="${url(a)}">Read more <span class="ar">→</span></a></div>`}
function block(t,list,key){if(!list.length)return `<div class="sec"><h2>${t}</h2><div class="empty">No stories published yet.</div></div>`;const n=limit[key+t]||4;
 return `<div class="sec"><h2><a href="/${key}">${t}</a></h2><div class="g">${list.slice(0,n).map(card).join('')}</div>${list.length>n?`<button class="more" onclick="limit['${key+t}']=${n}+4;go()">See more</button>`:''}</div>`}
function shell(inner,cur){
 const items=[['Home','/'],...CATS.map(c=>[c,'/'+SL[c]]),['Audio','/audio'],['Videos','/videos'],['Horoscope','/horoscope'],['Games','/games.html']];
 return `<div class="util" id="top"><div class="w"><span>${new Date().toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}<button class="wxb" id="wx" onclick="wxExact()" title="Tap to use your exact location">${wxHtml()}</button></span><span><a href="/p/support">Support</a><button class="thb" id="thm" aria-label="Toggle dark mode" onclick="toggleTheme()"></button></span></div></div>
 <a class="hd" href="/" aria-label="The Sujan Khadka — home"><img src="/header.webp" width="1600" height="262" fetchpriority="high" alt="The Sujan Khadka"></a>
 <div class="nb"><div class="w"><nav aria-label="Sections">${items.map(([t,h])=>`<a href="${h}" class="${cur===h?'on':''}">${t}</a>`).join('')}</nav><button id="mb" aria-label="Menu" aria-expanded="false" aria-controls="mp" onclick="const m=$('#mp');m.classList.toggle('open');this.setAttribute('aria-expanded',m.classList.contains('open'))"><i></i><i></i><i></i></button>
 <div id="mp"><h4>Sections</h4>${items.map(([t,h])=>`<a href="${h}">${t}</a>`).join('')}<a class="fy" href="/p/about">About</a><a class="fy" href="/p/contact">Contact</a><a class="fy" href="/p/support">Support us</a></div></div></div>
 <div class="w"><main id="main">${inner}</main></div>
 <footer><div class="w"><div class="g"><div><h4>Sections</h4>${CATS.map(c=>`<a href="/${SL[c]}">${c}</a>`).join('')}</div><div><a class="fy" href="/p/about">About</a><a class="fy" href="/p/contact">Contact</a><a class="fy" href="/p/support">Support us</a></div></div><div class="ins" id="ins"><div><h4>Install as an app</h4><span>Add the site to your home screen. Recent stories open even with weak internet.</span><span id="inh" style="display:none"></span></div><button class="bt" id="inb" onclick="installApp()">Install</button></div><div class="meta fb"><span>© ${new Date().getFullYear()} The Sujan Khadka. All rights reserved.</span><a href="#top" onclick="event.preventDefault();document.getElementById('top').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})">Back to top ↑</a></div></div></footer>`}

 let h=`<section class="lead"><div><div class="cat">${esc(lead.category)}</div><h1><a href="${url(lead)}">${esc(lead.title)}</a></h1><p>${esc(lead.subtitle)}</p><div class="meta">${esc(lead.author)} · ${fd(lead.date)}</div><a class="sm" href="${url(lead)}">Read more <span class="ar">→</span></a></div>${im?`<a href="${url(lead)}"><img class="ph" fetchpriority="high" decoding="async" src="${im}" alt="${esc(lead.imageCaption||lead.title)}"></a>`:`<a href="${url(lead)}" tabindex="-1" aria-hidden="true">${art(lead)}</a>`}</section>`;
 h+=ratesHtml();h+=bnHtml();
 if(sec.length)h+=`<div class="sec"><div class="g">${sec.map(card).join('')}</div></div>`;
 CATS.forEach(c=>h+=block(c,L.filter(a=>a.category===c),SL[c]));return h}
function stats(L){let v=0;for(const k in (D.views||{}))v+=+D.views[k]||0;let g=0;try{g=+localStorage.getItem('sk_games_played')||0}catch(e){}
 const c=(n,l)=>`<div class="st"><b data-n="${n}">${n.toLocaleString()}</b><span>${l}</span></div>`;
 return `<div class="stats">${c(L.length,'Stories published')}${c(v,'Total reads')}${c(g,'Games played')}</div>`}

 if(c==='World'){

 else if(c==='Culture & Lifestyle')h+=block('Culture',L.filter(a=>a.subcategory==='Culture'),k)+block('Lifestyle',L.filter(a=>a.subcategory==='Lifestyle'),k);
 else h+=block('Latest',rest,k);return h}
function body(t,ex=[]){const fig=x=>`<figure style="margin:1.5em 0"><img style="display:block" loading="lazy" decoding="async" src="${safeImg(x.url)}" alt="${esc(x.caption||'Photo')}">${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:''}</figure>`;let k=0;
 const out=esc(t).split(/\n{2,}/).map((p,i)=>{const mb=mediaBlock(p);if(mb)return mb;let h=p.startsWith('## ')?`<h2>${p.slice(3)}</h2>`:p.startsWith('&gt; ')?`<blockquote>${p.slice(5)}</blockquote>`:`<p>${p.replace(/\n/g,'<br>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" rel="noopener">$1</a>')}</p>`;if(i%2===1&&k<ex.length)h+=fig(ex[k++]);return h});
 while(k<ex.length)out.push(fig(ex[k++]));return out.join('')}

const DEF={about:'Hello, I\'m Sujan Kumar Khadka.\n\nI\'m a student and lifelong learner committed to personal growth, continuous learning, and professional development. I enjoy exploring new ideas, developing my skills, and discovering opportunities to grow both personally and professionally.\n\nThis website is my personal space on the internet, where I share news, opinion, and culture and lifestyle.\n\nI believe that consistency, curiosity, and a willingness to learn are essential for long-term success.\n\nMy goal is simple: to keep learning, keep improving, and create something meaningful along the way.\n\nThank you for visiting my website.\n\nLearning today. Building for tomorrow.',contact:'We would be glad to hear from you. Whether you have a question, a news tip, feedback or a correction, please write to us by email.\n\nEmail: sujankumarkhadka56@gmail.com\n\nWHAT YOU CAN WRITE TO US ABOUT\nNews tips and story ideas\nCorrections and feedback on our stories\nQuestions about the website\nPrivacy enquiries\n\nWHEN YOU WRITE\nPlease include a clear subject line and, if you are writing about a story, the link or headline. We read every message and reply as soon as we can.\n\nWe use your email address and message only to reply to you.',support:'The Sujan Khadka is independent, free to read and free of advertising. Your support helps us keep it that way. There are simple ways to help, and every one of them matters.\n\nREAD AND SHARE\nShare stories you value with friends, family and on social media. Word of mouth is the strongest support an independent site can have.\n\nTELL US WHAT YOU THINK\nHonest feedback makes our stories better. Tell us what you liked, what we missed and what you would like to read next.\n\nSEND A TIP OR A CORRECTION\nIf you know about a story we should cover, or you spot a mistake, please write to us. Our Contact page has the details.\n\nINSTALL THE APP\nAdd the site to your home screen from the footer of any page. Recent stories open even with a weak internet connection.\n\nThank you for reading and for being part of The Sujan Khadka.',privacy:"The Sujan Khadka respects your privacy. This page explains what information is handled when you use this website.\n\nWHAT WE COLLECT\nReaders do not need an account, and the site does not ask for your name, email or other personal details. If you email us, we use your email address and message only to reply.\n\nTECHNICAL DATA\nOur hosting provider, Cloudflare, processes technical data such as IP address and browser type to deliver the site and keep it secure. We do not use this data to identify individual readers.\n\nADVERTISING AND TRACKING\nThis site does not run advertising or third-party tracking scripts.\n\nEXTERNAL LINKS\nStories may link to other websites. We are not responsible for their privacy practices.\n\nQUESTIONS\nFor privacy questions, contact: sujankumarkhadka56@gmail.com\n\nWe may update this page from time to time. The latest version is always published here.",cookies:"This website does not use cookies to track readers.\n\nLOCAL STORAGE\nTo load faster, your browser may keep a copy of recently published stories on your device. This contains only public stories and no personal information. You can clear it at any time in your browser settings.\n\nSIGN-IN COOKIE\nA secure sign-in cookie is used only by the site developer to manage content. Readers never receive it.\n\nOTHER WEBSITES\nSites we link to may use their own cookies, which we do not control.\n\nQUESTIONS\nContact: sujankumarkhadka56@gmail.com",terms:"By using The Sujan Khadka you agree to these terms.\n\nCONTENT\nStories, text and images published here belong to The Sujan Khadka unless stated otherwise. You may share links and quote short extracts with credit and a link back. Please do not republish full stories or images without written permission.\n\nOPINION AND ACCURACY\nWe aim to be accurate and fair. Opinion pieces reflect the views of their authors. Content is for general information and is not professional advice. If you find an error, please email us.\n\nUSE OF THE SITE\nPlease do not misuse the site, try to disrupt it, or try to reach areas that are not public.\n\nLINKS\nWe may link to other websites and are not responsible for their content.\n\nCHANGES\nWe may update these terms or the site at any time.\n\nCONTACT\nsujankumarkhadka56@gmail.com"};

/* ---------- PDF → text import, copy-all and size meter for the article editor ---------- */
const SITE_LIMIT=4e6;let capKey=null,capRest=0,bsT=null;
async function pdfLib(){if(window.__pdfjs)return window.__pdfjs;const base=window.PDFJS_BASE||'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';

function pdfPageParas(tc){const lines=[];let cur=null,py=0;
 for(const it of tc.items){if(typeof it.str!=='string')continue;const y=it.transform[5],h=Math.abs(it.transform[3])||it.height||10,x=it.transform[4];
  if(cur&&Math.abs(y-py)<=Math.max(2,h*.5)){const gap=x-cur.x1;cur.t+=(gap>h*.15&&!/\s$/.test(cur.t)&&!/^\s/.test(it.str)?' ':'')+it.str;cur.x1=x+(it.width||0)}
  else{if(!it.str.trim())continue;cur={y,h,t:it.str,x1:x+(it.width||0)};lines.push(cur)}
  py=y;if(it.hasEOL)cur=null}
 const ls=lines.map(l=>({y:l.y,h:l.h,t:l.t.replace(/\s+/g,' ').trim()})).filter(l=>l.t&&!/^(page\s*)?\d{1,4}$/i.test(l.t));
 const gaps=[];for(let i=1;i<ls.length;i++){const d=ls[i-1].y-ls[i].y;if(d>0)gaps.push(d)}gaps.sort((a,b)=>a-b);const hs=ls.map(l=>l.h).sort((a,b)=>a-b),g=gaps.length>=3?gaps[gaps.length>>1]:(hs.length?hs[hs.length>>1]*1.35:0);

 ls.forEach((l,i)=>{const d=i?ls[i-1].y-l.y:0;const brk=i>0&&g&&(d>g*1.5||d<0);
  if(!p)p=l.t;else if(brk){paras.push(p);p=l.t}else if(/[-‐]$/.test(p)&&/^[a-z]/.test(l.t))p=p.slice(0,-1)+l.t;else p+=' '+l.t});
 if(p)paras.push(p);return paras}
const nWords=t=>{let w=0,inw=false;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i),sp=c<=32||c===160;if(!sp&&!inw){w++;inw=true}else if(sp)inw=false}return w};
async function pdfImport(f){if(!f)return;const st=$('#pdfst');

  const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise,out=[];let chars=0;
  for(let n=1;n<=doc.numPages;n++){st.textContent='Reading page '+n+' of '+doc.numPages+'…';
   const pg=await doc.getPage(n),ps=pdfPageParas(await pg.getTextContent());pg.cleanup();if(!ps.length)continue;chars+=ps.join('').length;
   if(out.length){const last=out[out.length-1],first=ps[0];if(!/[.!?:;"”’)\]\u0964]$/.test(last)&&/^[a-z]/.test(first)){out[out.length-1]=(/[-‐]$/.test(last)?last.slice(0,-1):last+' ')+first;ps.shift()}}
   out.push(...ps);if(n%10===0)await new Promise(r=>setTimeout(r))}
  if(chars<doc.numPages*15){st.textContent='';return alert('No readable text was found. This PDF is probably scanned pictures of pages, which need OCR. This importer reads real text only.')}
  const text=out.join('\n\n'),ta=$('#e_b');let add=false;

  bodyStat(true);st.textContent='Imported '+doc.numPages+' pages · '+nWords(text).toLocaleString()+' words. Check it, then save.'}

async function copyBody(){const ta=$('#e_b'),t=ta.value;if(!t)return alert('There is no text to copy.');

async function wxPlace(){

  const key=loc.lat.toFixed(2)+','+loc.lon.toFixed(2),c=lsGet('sk_w');

   if(!j||!j.current)return;wx={key,t:j.current.temperature_2m,code:j.current.weather_code,place:loc.place,ts:Date.now()};lsSet('sk_w',wx)}

async function vdSave(mut){A.pages=A.pages||{};const o=A.pages.__videos||{items:[]};o.items=o.items||[];mut(o.items);A.pages.__videos=o;return persist()}
async function vdAddLink(){const t=$('#vd_t').value.trim(),u=$('#vd_u').value.trim();
 if(!t)return alert('Please enter a title.');if(!u)return alert('Please paste a link.');
 if(!/^https:\/\//i.test(u)||!mediaBlock(u))return alert('This link is not supported. Use a YouTube or Vimeo link, or a direct https link to an MP4 / WebM file.');
 if(await vdSave(it=>it.push({id:'v'+Date.now(),title:t,desc:$('#vd_d').value.trim(),url:u,date:new Date().toISOString(),status:'published'})))go()}
const vidDur=f=>new Promise(ok=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';v.onloadedmetadata=()=>{ok(isFinite(v.duration)?Math.round(v.duration):0);URL.revokeObjectURL(u)};v.onerror=()=>{ok(0);URL.revokeObjectURL(u)};v.src=u});
async function vdUpload(){const t=$('#vf_t').value.trim(),f=$('#vf_f').files[0];

 if(f.type&&!f.type.startsWith('video/'))return alert('Please choose a video file.');

 const b=$('#vf_b'),bar=$('#vf_p'),desc=$('#vf_d').value.trim();b.disabled=true;b.textContent='Uploading…';

async function vdDel(id){if(!confirm('Delete this video from the website?'))return;await vdSave(it=>{const i=it.findIndex(x=>x.id===id);if(i>=0)it.splice(i,1)});go()}

  ne:['चन्द्रमा तपाईंकै राशिमा रहँदा मन र शरीर तालमा रहन्छन्। {B}को ख्याल गर्नुहोस् र ढिलो गरेको व्यक्तिगत योजना सुरु गर्नुहोस्।','परिवार, बोली र धन अगाडि आउँछन्; विशेषगरी {M}मा होसियार रहनुहोस्। घरमा बोली मधुर राख्नुहोस्।','साहस र मेहनतले फल दिन्छ। छोटो यात्रा, फोन र साना सुरुवात राम्रो हुन्छन्, विशेषगरी {W} जस्ता क्षेत्रमा।','घर र सुख-सुविधातर्फ ध्यान जान्छ तर सन्तुष्टि ढिलो आउँछ। चिन्तामा नडुब्नुहोस्, थकान हुँदा {B}को ख्याल गर्नुहोस् र सवारी तथा जग्गा-कागजात मिलाउनुहोस्।','अध्ययन, सन्तान र सिर्जनात्मक काम अगाडि आउँछन्, तर भावना निर्णयभन्दा अगाडि दौडन सक्छ। {M}को विषयमा निर्णय दोहोर्‍याएर जाँच्नुहोस्।','व्यावहारिक मनले प्रतिस्पर्धीभन्दा अगाडि बढ्न मद्दत गर्छ। {W} जस्ता क्षेत्रका नियमित काम र बाँकी हिसाब मिलाउन राम्रो दिन; {B}को स्याहार गर्नुहोस्।','साझेदार, ग्राहक र सार्वजनिक व्यवहारमा अनुकूलता रहन्छ। {L}ले सहजता ल्याउँछ; भेटघाट र सम्झौता सहज चल्छन्।','चन्द्राष्टम: चन्द्रमा तपाईंको आठौँ भावमा छ। ढिलाइ र बेचैनी हुन सक्छ; जोखिम र ठूला हस्ताक्षरबाट टाढा बस्नुहोस्, {B}को रक्षा गर्नुहोस् र दिन सरल राख्नुहोस्।','भाग्य मिश्रित रहन्छ र आस्था अलिकति परीक्षा हुन्छ। {W} जस्ता क्षेत्रमा ठूलो कदम चाल्नुअघि गुरु वा ज्येष्ठको सल्लाह लिनुहोस्; आवश्यक नपरे लामो यात्रा नगर्नुहोस्।','काम र जिम्मेवारीमा साथ मिल्छ। {W} जस्ता क्षेत्रमा नेतृत्व लिन र नतिजा देखाउन बलियो दिन।','लाभ र मित्र सक्रिय रहन्छन्। अनुरोध र प्रस्ताव राम्रोसँग स्वीकार हुन्छन् र पुरानो चिनजानले {W} जस्ता क्षेत्रमा काम आउन सक्छ।','खर्च र एकान्तको विषय अगाडि आउँछ। आराम, पूजापाठ र शान्त काम मिल्छ; खर्च सीमित राख्नुहोस्, {B}लाई आराम दिनुहोस् र राति जागा नबस्नुहोस्।']},

 SGN={en:[['Your natural drive is backed today; start what you have been putting off.','Your urge to rush works against you today; pause before replying or buying.'],['Your patience pays off; steady, practical steps bring comfort.','Stubbornness can cost you today; stay flexible and avoid impulse spending.'],['Your quick mind finds the right words; a good day for talks and deals.','Too many thoughts scatter your focus; finish one task before taking the next.'],['Your caring nature wins trust; family support is close at hand.','Mood swings are likely; protect your energy and do not take remarks personally.'],['Confidence is high and people respond to your warmth.','Pride may block a good offer; listen first and let others share the credit.'],['Careful planning pays; details you check today save trouble later.','Over-analysing drains you; do the useful thing and let small errors pass.'],['Balance and fairness help you settle a pending matter.','Indecision delays you; choose, even if the choice is not perfect.'],['Your focus and intuition are sharp; dig into what needs understanding.','Suspicion can sour a good situation; ask directly before assuming.'],['Optimism opens doors; share your plans with someone you trust.','Careless promises create trouble; say less and keep what you say.'],['Discipline brings visible progress; stick to the plan.','Heavy duty feels lonely; take a short break and ask for a hand.'],['Original ideas and friends help; try a new approach.','Detachment can look like coldness; keep in touch with those close to you.'],['Intuition and kindness guide you well; trust a quiet inner nudge.','Daydreaming and worry blur reality; write down the facts before deciding.']],
  ne:[['तपाईंको स्वाभाविक जोस आज साथ दिन्छ; ढिलाइ गरेको काम सुरु गर्नुहोस्।','हतारले आज बिगार्न सक्छ; जवाफ वा खरिद गर्नुअघि एक क्षण रोकिनुहोस्।'],['तपाईंको धैर्यले फल दिन्छ; स्थिर र व्यावहारिक कदमले सुख दिन्छ।','जिद्दीले आज नोक्सान गर्न सक्छ; लचिलो बन्नुहोस् र आवेगमा खर्च नगर्नुहोस्।'],['तपाईंको तीक्ष्ण बुद्धिले उचित शब्द भेट्टाउँछ; कुराकानी र सम्झौताका लागि राम्रो।','धेरै सोचले ध्यान छरिन्छ; एउटा काम सक्याएर मात्र अर्को सुरु गर्नुहोस्।'],['तपाईंको स्नेही स्वभावले विश्वास जित्छ; परिवारको साथ नजिकै छ।','मन चलमल हुन सक्छ; ऊर्जा जोगाउनुहोस् र अरूका कुरालाई व्यक्तिगत नलिनुहोस्।'],['आत्मविश्वास उच्च रहन्छ र मानिसले तपाईंको न्यानोपनलाई सकारात्मक लिन्छन्।','अहंकारले राम्रो प्रस्ताव रोक्न सक्छ; पहिले सुन्नुहोस् र श्रेय बाँड्नुहोस्।'],['सावधान योजनाले फल दिन्छ; आज जाँचेका विवरणले पछि समस्या बचाउँछ।','अति विश्लेषणले थकाउँछ; उपयोगी काम गर्नुहोस् र साना त्रुटि जान दिनुहोस्।'],['सन्तुलन र न्यायप्रियताले बाँकी विषय मिलाउन मद्दत गर्छ।','अनिर्णयले ढिलाइ हुन्छ; पूर्ण नभए पनि निर्णय लिनुहोस्।'],['तपाईंको एकाग्रता र अन्तर्ज्ञान तीक्ष्ण छ; बुझ्नुपर्ने विषयमा गहिराइमा जानुहोस्।','शंकाले राम्रो अवस्था बिगार्न सक्छ; अनुमान गर्नुअघि सोझै सोध्नुहोस्।'],['आशावादी सोचले ढोका खोल्छ; योजना विश्वासिलो व्यक्तिसँग बाँड्नुहोस्।','लापरवाह वाचाले समस्या ल्याउँछ; कम बोल्नुहोस् र बोलेको निभाउनुहोस्।'],['अनुशासनले देखिने प्रगति दिन्छ; योजनामै अडिनुहोस्।','भारी जिम्मेवारीले एक्लो लाग्छ; छोटो विश्राम लिनुहोस् र सहयोग माग्नुहोस्।'],['मौलिक विचार र मित्रले साथ दिन्छन्; नयाँ तरिका आजमाउनुहोस्।','अलगावलाई चिसोपन ठानिन सक्छ; नजिकका मानिससँग सम्पर्कमा रहनुहोस्।'],['अन्तर्ज्ञान र दयाले राम्रो दिशा दिन्छ; मनको शान्त सङ्केतमा विश्वास गर्नुहोस्।','दिवास्वप्न र चिन्ताले यथार्थ धमिलो हुन्छ; निर्णय गर्नुअघि तथ्य लेख्नुहोस्।']]};

['स्थिर र गुणस्तरीय कामले विश्वास जित्छ; परिचित क्षेत्रमा राम्रो गर्नुहुन्छ।','बचत राम्रो हुन्छ र धन बिस्तारै बढ्छ; सुखसुविधामै मात्र खर्च नगर्नुहोस्।','निष्ठा र राम्रो खानाले घर न्यानो राख्छ; जिद्दी नै जोखिम हो।','घाँटी, ढाड र तौलमा ध्यान दिनुहोस्; खाना हल्का र नियमित राख्नुहोस्।'],
['सञ्चार, लेखन र तीक्ष्ण सोचले काम अघि बढाउँछ।','धेरै साना स्रोतले साथ दिन्छन्; कुनै नछुटोस् भनी हिसाब राख्नुहोस्।','कुराकानी र हास्यले तनाव घटाउँछ, तर बोल्नुजति सुन्नुहोस्।','फोक्सो, पाखुरा र स्नायुलाई आराम चाहिन्छ; तालिका बोझिलो नबनाउनुहोस्।'],
['स्याहार र सेवामूलक काम मिल्छ; मानिससँगको व्यवहारमा अन्तर्ज्ञानमा भरोसा गर्नुहोस्।','तपाईं पैसामा होसियार हुनुहुन्छ र परिवारको सुरक्षाका लागि जोगाउनुहुन्छ।','घर र आमा तपाईंको आधार हुन्; भावना गहिरो छ, त्यसैले कोमल रहनुहोस्।','छाती, पेट र मनस्थिति जोडिएका छन्; समयमै खानुहोस् र शान्त रहनुहोस्।'],
['नेतृत्वमा तपाईं चम्कनुहुन्छ; निरन्तर प्रयासपछि मान्यता आउँछ।','प्रतिष्ठाका लागि उदार भएर खर्च गर्नुहुन्छ; देखावटअघि बजेट बनाउनुहोस्।','न्यानोपन र निष्ठाले परिवार बाँध्छ; चोट खाएको अहंकारबाट जोगिनुहोस्।','मुटु, ढाड र रक्तचापमा ध्यान दिनुहोस्; थाकेपछि आराम गर्नुहोस्।'],
['विवरण, विश्लेषण र सेवाले तपाईंलाई मूल्यवान् बनाउँछ; शुद्धता तपाईंको बल हो।','होसियारीपूर्वक बजेट बनाउनु राम्रो; चिन्ताले कन्जुस नबनाउनुहोस्।','घरमा चुपचाप सहयोग गर्नुहुन्छ; सुधार मात्र होइन, मीठा शब्द पनि भन्नुहोस्।','पाचन र स्नायु संवेदनशील छन्; खाना सफा र दिनचर्या नियमित राख्नुहोस्।'],
['न्यायपूर्ण व्यवहार र साझेदारीले काम सहज बनाउँछ; कूटनीतिले ढोका खोल्छ।','सम्झौता र साझेदारबाट पैसा आउँछ; अरूलाई खुसी पार्न खर्च नगर्नुहोस्।','मेलमिलाप तपाईंलाई प्यारो छ; मौन बसेर शान्ति राख्नुको सट्टा निर्णय गर्नुहोस्।','मिर्गौला र तल्लो ढाडको ख्याल गर्नुहोस्; पानी पिउनुहोस् र लामो समय नबस्नुहोस्।'],
['गहिराइ र अनुसन्धानले तपाईंलाई अलग बनाउँछ; पर्दा पछाडिको काम फलदायी हुन्छ।','साझा धन, ऋण र लुकेको आम्दानीमा स्पष्ट अभिलेख राख्नुहोस्।','निष्ठा गहिरो छ, मौनता पनि; मनमा भएको कुरा बाँड्नुहोस्।','प्रजनन र उत्सर्जन स्वास्थ्यमा नियमितता चाहिन्छ; सानो संकेत नटार्नुहोस्।'],
['शिक्षण, सल्लाह, यात्रा र कानुन मिल्छ; ठूला लक्ष्य राख्नुहोस्।','भाग्यले आम्दानीमा साथ दिन्छ, तर अति आत्मविश्वासले नोक्सान हुन सक्छ; जगेडा राख्नुहोस्।','स्वतन्त्रता र इमानदारीले सम्बन्ध बनाउँछ; घरमा साना वाचा पनि निभाउनुहोस्।','कम्मर, तिघ्रा र कलेजोको ख्याल गर्नुहोस्; गरिष्ठ खाना र अति परिश्रमबाट जोगिनुहोस्।'],
['अनुशासन र लामो प्रयासले अधिकार दिन्छ; तपाईंलाई जिम्मेवारी सुम्पिन्छन्।','कडा मेहनतले बचत बिस्तारै बढ्छ; डरले कन्जुस नबन्नुहोस्।','तपाईं जुटाएर माया देखाउनुहुन्छ; उपस्थित रहने समय पनि निकाल्नुहोस्।','घुँडा, हड्डी र जोर्नीलाई न्यानो र आराम चाहिन्छ; व्यायाम नछोड्नुहोस्।'],
['असामान्य विचार र प्रविधिले मद्दत गर्छ; सञ्जालबाट अवसर आउँछ।','मित्र र समूहबाट आम्दानी आउँछ; जोखिमपूर्ण प्रयोगबाट जोगिनुहोस्।','सम्बन्धमा तपाईं ठाउँ चाहनुहुन्छ; के चाहिन्छ स्पष्ट भन्नुहोस्।','पिँडुला, खुट्टा र रक्तसञ्चारमा ख्याल गर्नुहोस्; हिँडडुल गर्नुहोस् र न्यानो रहनुहोस्।'],
['सिर्जनात्मक, उपचार र आध्यात्मिक काम मिल्छ; अन्तर्ज्ञानमा भरोसा गर्नुहोस्।','दया वा अन्योलले पैसा खसी जान सक्छ; हिसाब स्पष्ट राख्नुहोस्।','तपाईं माग्नुभन्दा बढी दिनुहुन्छ; आफ्नो ऊर्जा पनि जोगाउनुहोस्।','खुट्टा, निद्रा र प्रतिरक्षामा ध्यान दिनुहोस्; राति नजाग्नुहोस् र राम्ररी सुत्नुहोस्।']]},

 x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText).url)}catch(e){no('the server gave an unexpected reply')}}else no('the server answered '+x.status)};
 x.onerror=()=>no('network error');x.send(f)})}
const auDur=f=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{ok(isFinite(a.duration)?Math.round(a.duration):0);URL.revokeObjectURL(u)};a.onerror=()=>{ok(0);URL.revokeObjectURL(u)};a.src=u});
async function auUpload(){const t=$('#au_t').value.trim(),f=$('#au_f').files[0];
 if(!t)return alert('Please enter a title.');if(!f)return alert('Please choose an audio file.');
 if(f.type&&!f.type.startsWith('audio/'))return alert('Please choose an audio file.');
 if(f.size>10e6)return alert('This file is '+(f.size/1e6).toFixed(1)+' MB. The limit is 10 MB (about 10 minutes of MP3). Please compress it or upload a shorter clip.');
 const b=$('#au_b'),bar=$('#au_p'),desc=$('#au_d').value.trim();b.disabled=true;b.textContent='Uploading…';
 try{const url=await putAudio(f,n=>{bar.style.width=n+'%';b.textContent='Uploading… '+n+'%'}),dur=await auDur(f);
  A.audios=A.audios||[];A.audios.push({id:'u'+Date.now(),title:t,desc,url,dur,size:f.size,date:new Date().toISOString(),status:'published'});
  if(await persist())go()}catch(e){alert('Audio upload failed: '+(e||'unknown error'));b.disabled=false;b.textContent='Upload audio'}}
async function auPub(id){const a=A.audios.find(x=>x.id===id);if(!a)return;a.status=a.status==='published'?'draft':'published';await persist();go()}
async function auDel(id){if(!confirm('Delete this audio from the website?'))return;A.audios=A.audios.filter(x=>x.id!==id);await persist();go()}
function share(){const d={title:document.title,url:location.href};if(navigator.share)navigator.share(d).catch(()=>{});else navigator.clipboard.writeText(d.url).then(()=>alert('Link copied'))}
addEventListener('popstate',()=>swap(go));

/* ---------- motion engine ---------- */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let io=null,navDir=0,lastCur=null,first=true,lastPath='';
function swap(fn){const m=$('#main');if(RM||!m||!ready||first){fn();return}m.classList.add('mo');setTimeout(fn,200)}
function words(el){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(tw.nextNode())ns.push(tw.currentNode);let i=0;
 ns.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}
  const w=document.createElement('span');w.className='wd';w.textContent=t;w.style.animationDelay=(i++*.06+.05)+'s';f.appendChild(w)});n.parentNode.replaceChild(f,n)})}
function countUp(el){const to=+el.dataset.n,t0=performance.now(),d=1500;(function f(t){const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}
function motion(){
 window.__upd&&window.__upd();
 const same=lastPath===location.pathname,m=$('#main');lastPath=location.pathname;
 const fst=first;first=false;
 if(RM||same||!('IntersectionObserver' in window))return;
 if(m&&!fst){m.style.setProperty('--dx',navDir+'px');m.classList.add('mi')}
 document.querySelectorAll('main h1').forEach(h=>{if(!h.querySelector('.wd'))words(h)});
 io&&io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add('in');if(t.classList.contains('stats'))t.querySelectorAll('[data-n]').forEach(countUp);io.unobserve(t)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
 document.querySelectorAll('main .stats').forEach(st=>{st.querySelectorAll('[data-n]').forEach(n=>n.textContent='0');st.classList.add('rv');io.observe(st)});
 document.querySelectorAll('main .sec').forEach(sec=>{sec.classList.add('rv');io.observe(sec);
  sec.querySelectorAll('.card').forEach((c,i)=>{c.classList.add('rv');c.style.setProperty('--d',(i%4)*.09+'s');io.observe(c)})});
 document.querySelectorAll('main .lead>*, main article>*, main .pg>:not(h1)').forEach((c,i)=>{c.classList.add('rv');c.style.setProperty('--d',Math.min(i,6)*.07+'s');io.observe(c)})}
/* theme toggle */
function effTheme(){return document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function thUi(){const b=$('#thm');if(b)b.textContent=effTheme()==='dark'?'☀ Light':'☾ Dark'}
function toggleTheme(){const h=document.documentElement,n=effTheme()==='dark'?'light':'dark';h.classList.add('tx');h.setAttribute('data-theme',n);try{localStorage.setItem('sk_theme',n)}catch(e){}thUi();setTimeout(()=>h.classList.remove('tx'),700)}
/* progress bar, sticky nav, back-to-top, header parallax */
(function(){const pg=document.createElement('div');pg.id='pg';const bt=document.createElement('button');bt.id='btt';bt.setAttribute('aria-label','Back to top');
 bt.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
 bt.onclick=()=>scrollTo({top:0,behavior:RM?'auto':'smooth'});document.body.append(pg,bt);
 let t=0;const upd=()=>{t=0;const y=scrollY,ar=document.querySelector('article');let p;
  if(ar){const r=ar.getBoundingClientRect(),tot=r.height-innerHeight*.55;p=tot>0?-r.top/tot:0}else{const h=document.documentElement.scrollHeight-innerHeight;p=h>0?y/h:0}
  pg.style.transform='scaleX('+Math.max(0,Math.min(1,p))+')';
  const nb=document.querySelector('.nb');if(nb)nb.classList.toggle('sc',y>90);bt.classList.toggle('show',y>500);
  if(!RM){const i=document.querySelector('.hd img');if(i&&y<400)i.style.objectPosition='right calc(50% + '+y*.08+'px)'}};
 window.__upd=upd;addEventListener('scroll',()=>{if(!t)t=requestAnimationFrame(upd)},{passive:true});addEventListener('resize',upd);upd()})();
/* ---------- install as app ---------- */
let dip=null;const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;insUi()});
addEventListener('appinstalled',()=>{dip=null;insUi()});
function insUi(){const b=$('#inb'),b2=$('#ins'),h=$('#inh');if(!b2)return;
 if(standalone()){b2.style.display='none';return}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(dip){b.style.display='';h.style.display='none'}
 else if(ios){b.style.display='none';h.style.display='block';h.textContent='On iPhone: tap Share, then “Add to Home Screen”.'}
 else{b.style.display='';h.style.display='none'}}
async function installApp(){if(dip){dip.prompt();await dip.userChoice.catch(()=>{});dip=null;insUi()}else alert('Open your browser menu and choose “Install app” or “Add to Home screen”.')}

 if(!ready||t!==o){D=x;ready=true;if(pub_())go()}try{localStorage.setItem('sk_d',t)}catch(e){}adFresh=true;adInit(true)}).catch(()=>{if(!ready){ready='err';if(pub_())go()}});
