<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://raw.githubusercontent.com data:; style-src 'self'; script-src 'self'; connect-src https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Login</title><link rel="stylesheet" href="./developer-styles.css"></head>
<body>
<main class="auth-page">
<form id="loginForm" class="panel">
<h1>Developer Login</h1>
<label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Login</button>
<p id="message" class="error"></p>
</form>
</main>
<script src="./developer-config.js"></script><script src="./developer-auth.js"></script>
</body>
</html>
