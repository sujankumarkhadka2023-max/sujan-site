<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Puzzle | Sujan Kumar Khadka</title>
<link rel="stylesheet" href="games.css">
<style>

.slots,.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.s,.k{width:clamp(34px,10.5vw,48px);height:clamp(40px,12vw,54px);border:1.5px solid #000;border-radius:8px;font-size:clamp(18px,6vw,26px);font-weight:700;text-transform:uppercase;padding:0;background:#fff}
.s{border-style:dashed;background:#fafafa}
.s.f{border-style:solid}.s.lk{background:#d6f0d6;border-style:solid}.s.bad{background:#ffd9d9;border-color:#d00}
.k{background:#000;color:#fff}.k:disabled{opacity:.15}
.clue{text-align:center;font-size:18px;margin:14px 0 4px}
.clue small{display:block;color:#666;font-size:12px}

</style>
</head>
<body>
<div class="wrap">
<div id="home"></div>
<div id="game" class="hide">
  <div class="top"><button class="btn" id="back">← Levels</button><div style="text-align:right"><h1 id="ttl"></h1><div class="sub" id="tier"></div></div></div>
  <div class="bar" id="info"></div>
  <div id="stage"></div>
  <div id="ctrl"></div>
</div>
</div>
<div class="modal hide" id="modal"><div class="box" id="mbox"></div></div>
<script src="common.js"></script>
<script>

(function(){
var $=function(s){return document.querySelector(s)};
var RAW="fish:swims in water;desk:you study at it;tree:has leaves;book:you read it;wolf:howls at night;rain:falls from clouds;moon:shines at night;bird:has wings;cake:birthday treat;door:you open it;gold:yellow metal;hand:has five fingers;jump:leap up;king:rules a kingdom;milk:from a cow;duck:says quack;plum:purple fruit;road:cars drive on it;sand:on the beach;rice:staple grain;wind:moving air;boat:floats on water;frog:hops and croaks;corn:yellow cob;farm:grows crops;apple:red fruit;pizza:cheesy Italian dish;chair:you sit on it;dance:move to music;eagle:bird of prey;flame:fire's glow;mango:tropical fruit;house:you live in it;juice:fruit drink;knife:cuts food;olive:green or black fruit;money:you spend it;train:runs on rails;beach:sand and sea;plant:grows in soil;queen:female ruler;river:flows to the sea;camel:desert animal;tiger:striped big cat;uncle:parent's brother;voice:you speak with it;water:you drink it;youth:young age;zebra:striped horse-like animal;sheep:gives wool;button:on a shirt;orange:fruit and colour;planet:orbits a star;rocket:goes to space;copper:reddish metal;window:glass in a wall;yellow:colour of the sun;bridge:crosses a river;temple:place of worship;dragon:fire-breathing myth;pillow:for your head;guitar:six strings;island:land in water;jungle:dense forest;kitten:baby cat;ladder:climb with it;market:buy and sell here;number:you count with it;pencil:writes and erases;rabbit:long ears;balloon:floats with air;chicken:lays eggs;diamond:hard gemstone;giraffe:long neck;library:lends books;elephant:has a trunk;football:the world's sport;mountain:very high land;notebook:write in it;umbrella:keeps off rain;sandwich:between two breads;hospital:doctors work here;birthday:yearly celebration;computer:you are using one;dinosaur:extinct giant;backpack:carry on shoulders;painting:art on canvas;treasure:pirate's loot;airplane:flies passengers;chocolate:sweet cocoa treat;adventure:exciting journey;butterfly:colourful winged insect;crocodile:green river reptile;telephone:you call with it;fireworks:sky festival lights;hurricane:violent storm;waterfall:water falling down;blueberry:small blue fruit;newspaper:daily printed news;wonderful:very good".split(";").filter(Boolean).map(function(x){var p=x.trim().split(":");return{w:p[0],h:p[1]}});
var T=[0,25,50,75,100],LV=[];
for(var t=0;t<4;t++)LV=LV.concat(RAW.slice(t*25,t*25+25).sort(function(a,b){return a.w.length-b.w.length}));
function item(l){return LV[l-1]}
var w,tiles,slots,lock,hints,miss,over;
SKG.init({key:"sk_word",title:"Word Puzzle",sub:function(l){return item(l).w.length+" letters"},start:start});
function start(l){
  var it=item(l);w=it.w;var r=SKG.rng(l*53+11),idx=w.split("").map(function(_,i){return i});
  do{SKG.shuffle(idx,r)}while(idx.every(function(v,i){return w[v]===w[i]})&&w.length>1&&new Set(w).size>1);
  tiles=idx.map(function(i){return w[i]});slots=w.split("").map(function(){return -1});lock=w.split("").map(function(){return false});
  hints=2;miss=0;over=false;
  $("#info").innerHTML='<span>⏱ <b id="tm">00:00</b></span><span>Mistakes: <b id="ms">0</b></span><span>Hints: <b id="hs">2</b></span>';
  $("#stage").innerHTML='<div class="clue">Unscramble the word<small>Clue: '+it.h+'</small></div><div class="slots" id="sl"></div><div class="tiles" id="tl"></div>';
  $("#ctrl").innerHTML='<div class="acts"><button class="btn" id="cl">Clear</button><button class="btn" id="sh">Shuffle</button><button class="btn" id="ht">Hint</button></div>';
  $("#cl").onclick=function(){if(over)return;slots=slots.map(function(s,i){return lock[i]?s:-1});draw()};
  $("#sh").onclick=function(){if(over)return;/* shuffle visual order of unused tiles */var u=[];tiles.forEach(function(_,i){if(slots.indexOf(i)<0)u.push(i)});
    var vals=u.map(function(i){return tiles[i]});SKG.shuffle(vals,Math.random);u.forEach(function(i,k){tiles[i]=vals[k]});draw()};
  $("#ht").onclick=hint;
  SKG.startT();draw()}
function used(i){return slots.indexOf(i)>=0}
function draw(){
  var sl=$("#sl"),tl=$("#tl");sl.innerHTML="";tl.innerHTML="";
  slots.forEach(function(ti,i){var b=document.createElement("button");b.className="s"+(ti>=0?" f":"")+(lock[i]?" lk":"");b.textContent=ti>=0?tiles[ti]:"";
    b.onclick=function(){if(over||lock[i]||slots[i]<0)return;slots[i]=-1;draw()};sl.appendChild(b)});
  tiles.forEach(function(ch,i){var b=document.createElement("button");b.className="k";b.textContent=ch;b.disabled=used(i);
    b.onclick=function(){if(over)return;var e=slots.indexOf(-1);if(e<0)return;slots[e]=i;draw();check()};tl.appendChild(b)});
  $("#ms").textContent=miss;$("#hs").textContent=hints;$("#ht").disabled=hints<=0}
function check(){
  if(slots.indexOf(-1)>=0)return;
  var g=slots.map(function(i){return tiles[i]}).join("");
  if(g===w){over=true;var st=3-(hints<2?1:0)-(miss>=2?1:0);if(st<1)st=1;
    $("#sl").querySelectorAll(".s").forEach(function(b){b.classList.add("lk")});
    setTimeout(function(){SKG.win(st,"Word: <b>"+w.toUpperCase()+"</b> · Mistakes: <b>"+miss+"</b>")},500)}
  else{miss++;var bs=$("#sl").querySelectorAll(".s");bs.forEach(function(b,i){if(!lock[i])b.classList.add("bad")});
    over=true;setTimeout(function(){over=false;slots=slots.map(function(s,i){return lock[i]?s:-1});draw()},700);$("#ms").textContent=miss}}
function hint(){
  if(over||hints<=0)return;
  slots=slots.map(function(s,i){return lock[i]?s:-1});
  var i=lock.indexOf(false);if(i<0)return;
  for(var k=0;k<tiles.length;k++)if(!used(k)&&tiles[k]===w[i]){slots[i]=k;lock[i]=true;break}
  hints--;draw();check()}
})();

</script>
</body>
</html>
